<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Sourcebook</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#09090B">
<style>
  /*__ALLO_FONT_CSS__*/
  :root{
    --bg:#09090b; --panel:#101013; --panel2:#17171c;
    --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.15);
    --ink:#fafafa; --dim:#a1a1aa; --dim2:#71717a;
    --accent:#fafafa; --accent-fg:#09090b;
    --ok:#10b981; --warn:#f59e0b;
    --sans:'Allo',system-ui,-apple-system,sans-serif;
    --display:'Allo',system-ui,-apple-system,sans-serif;
    --mono:'Allo',system-ui,-apple-system,sans-serif;
    --code:'Allo',system-ui,-apple-system,sans-serif;
    --allo-body-rond:"ROND" 45;
    --allo-display-rond:"ROND" 28;
    --allo-mono-rond:"ROND" 36;
    --allo-code-rond:"ROND" 22;
    --sys-radius:999px; --card-radius:12px;
    --header-bg:rgba(9,9,11,.84);
    --ease-out:cubic-bezier(.22,1,.36,1);
    --t-theme:.32s var(--ease-out);
    --t-ui:.18s var(--ease-out);
    --sb-accent:var(--ink);
  }
  html{color-scheme:dark}
  html.sys-light{color-scheme:light}
  *::-webkit-scrollbar{width:9px;height:9px}
  *::-webkit-scrollbar-track{background:transparent}
  html::-webkit-scrollbar-track{background:var(--bg)}
  *::-webkit-scrollbar-thumb{background:color-mix(in srgb,color-mix(in srgb,var(--sb-accent,var(--ink)) 42%,var(--ink)) 24%,transparent);border-radius:999px;border:2.5px solid transparent;background-clip:padding-box;min-height:36px}
  *::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,color-mix(in srgb,var(--sb-accent,var(--ink)) 62%,var(--ink)) 56%,transparent);border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:active{background:color-mix(in srgb,color-mix(in srgb,var(--sb-accent,var(--ink)) 82%,var(--ink)) 84%,transparent);border:2px solid transparent;background-clip:padding-box}
  .ds-select-list::-webkit-scrollbar,.ldb-insp-body::-webkit-scrollbar,.prompt-box pre::-webkit-scrollbar,.ldb-code::-webkit-scrollbar,.cmd code::-webkit-scrollbar{width:7px;height:6px}
  *::-webkit-scrollbar-button{display:none;width:0;height:0}
  *::-webkit-scrollbar-corner{background:transparent}
  @supports not selector(::-webkit-scrollbar){
    *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,color-mix(in srgb,var(--sb-accent,var(--ink)) 48%,var(--ink)) 30%,transparent) transparent}
    html{scrollbar-color:color-mix(in srgb,color-mix(in srgb,var(--sb-accent,var(--ink)) 48%,var(--ink)) 30%,transparent) var(--bg)}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-optical-sizing:auto;font-variation-settings:var(--allo-body-rond);font-feature-settings:"calt" 1,"liga" 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color var(--t-theme),color var(--t-theme)}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  input,select,textarea,option{font:inherit;color:inherit}
  button,input,select,textarea,option{font-variation-settings:inherit;font-feature-settings:inherit;font-optical-sizing:inherit}

  /* ---------- top progress loader & transitions ---------- */
  .top-loader{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;pointer-events:none;opacity:0;transition:opacity .15s}
  .top-loader.on{opacity:1}
  .top-loader::after{content:'';display:block;height:100%;width:38%;background:var(--ink);animation:loaderSlide .7s infinite cubic-bezier(.4,0,.2,1)}
  @keyframes loaderSlide{0%{transform:translateX(-100%)}100%{transform:translateX(270%)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeIn .22s var(--ease-out) both}

  html.vt-snap,html.vt-snap *,html.vt-snap *::before,html.vt-snap *::after{transition-duration:0s !important}
  html[data-vt-kind="page"]{--vt-dur:.2s}
  html[data-vt-kind="tab"]{--vt-dur:.22s}
  html[data-vt-kind="chameleon"]{--vt-dur:.3s}
  ::view-transition{background:var(--bg)}
  @keyframes vtFadeOut{from{opacity:1}to{opacity:0}}
  @keyframes vtFadeIn{from{opacity:0}to{opacity:1}}
  ::view-transition-old(root){animation:vtFadeOut var(--vt-dur,.22s) var(--ease-out) both}
  ::view-transition-new(root){animation:vtFadeIn var(--vt-dur,.22s) var(--ease-out) both}
  ::view-transition-group(topbar){z-index:20;animation-duration:var(--vt-dur,.22s);animation-timing-function:var(--ease-out)}
  ::view-transition-old(topbar){animation:vtFadeOut var(--vt-dur,.22s) var(--ease-out) both}
  ::view-transition-new(topbar){animation:vtFadeIn var(--vt-dur,.22s) var(--ease-out) both}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;scroll-behavior:auto !important}
    ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important}
  }

  /* ---------- header & segmented pills ---------- */
  header.top{position:sticky;top:0;z-index:30;background:var(--header-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);view-transition-name:topbar;transition:background-color var(--t-theme),border-color var(--t-theme),color var(--t-theme)}
  .bar{max-width:1360px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px}
  .brand{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;cursor:pointer;padding:4px 2px;transition:opacity .12s ease-out}
  .brand:hover{opacity:.82}
  .brand svg{width:22px;height:22px;color:var(--ink);flex:none;overflow:visible}
  .ds-slabs{animation:dsPrismShift 14s linear infinite;will-change:filter}
  @keyframes dsPrismShift{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
  html.sys-active .ds-slabs{animation:none;filter:none}
  .ds-s1{fill:url(#ds-g1);transition:fill var(--t-theme)}
  .ds-s2{fill:url(#ds-g2);transition:fill var(--t-theme)}
  .ds-s3{fill:url(#ds-g3);transition:fill var(--t-theme)}
  html.sys-active .ds-s1{fill:var(--ds-c1,var(--accent))}
  html.sys-active .ds-s2{fill:var(--ds-c2,var(--accent))}
  html.sys-active .ds-s3{fill:var(--ds-c3,var(--accent))}
  .brand b{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}

  .search{flex:1;position:relative;min-width:170px;max-width:280px;margin-left:6px}
  .search input{width:100%;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);border-radius:999px;padding:6.5px 34px 6.5px 32px;color:var(--ink);font-family:var(--sans);font-size:12.5px;outline:none;transition:border-color .14s ease-out,background-color .14s ease-out,color var(--t-theme)}
  .search input:hover:not(:focus){border-color:color-mix(in srgb,var(--ink) 14%,transparent);background:color-mix(in srgb,var(--ink) 5%,transparent)}
  .search input:focus{border-color:color-mix(in srgb,var(--ink) 24%,transparent);background:color-mix(in srgb,var(--ink) 6.5%,transparent)}
  .search input::placeholder{color:var(--dim2)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim2);pointer-events:none}
  .search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--code);font-size:10px;line-height:1.2;color:var(--dim2);background:color-mix(in srgb,var(--ink) 5%,transparent);border:1px solid var(--line);border-radius:4px;padding:1px 5px;pointer-events:none;transition:border-color var(--t-theme),color var(--t-theme),background-color var(--t-theme)}

  .seg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 3.5%,transparent);border:1px solid var(--line);transition:background-color var(--t-theme),border-color var(--t-theme)}
  .seg-right{margin-left:auto;display:flex;align-items:center;gap:2px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:500;color:var(--dim);border:1px solid transparent;transition:color .12s ease-out,background-color .12s ease-out,border-color .12s ease-out;white-space:nowrap}
  .chip svg{width:12px;height:12px;flex:none}
  .chip:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5.5%,transparent)}
  .chip:focus-visible,.pill-btn:focus-visible,.pager-btn:focus-visible,.ds-select-btn:focus-visible{outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 18%,transparent)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:550;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .chip[aria-pressed="true"]:hover{background:color-mix(in srgb,var(--ink) 88%,var(--bg));color:var(--bg)}
  .pill-btn{display:inline-flex;align-items:center;gap:6px;padding:5.5px 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--dim);background:color-mix(in srgb,var(--ink) 3.5%,transparent);border:1px solid var(--line);transition:color .12s ease-out,background-color .12s ease-out,border-color .12s ease-out;white-space:nowrap}
  .pill-btn svg{width:12px;height:12px;flex:none}
  .pill-btn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 20%,transparent);background:color-mix(in srgb,var(--ink) 7%,transparent)}
  .pill-btn:active{background:color-mix(in srgb,var(--ink) 10%,transparent)}
  .pill-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:550}
  .pill-btn.primary:hover{background:color-mix(in srgb,var(--ink) 88%,var(--bg));border-color:color-mix(in srgb,var(--ink) 88%,var(--bg));color:var(--bg)}
  .pill-btn.primary:active{background:color-mix(in srgb,var(--ink) 80%,var(--bg))}

  /* ---------- layout & subheader ---------- */
  main{max-width:1360px;margin:0 auto;padding:24px 24px 80px}
  .meta{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:28px}
  .meta h1{font-size:13px;font-weight:550;letter-spacing:-.01em;margin:0;color:var(--ink)}
  .meta em{font-style:normal;color:var(--dim2);font-size:12px;font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- catalog cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden;cursor:pointer;transition:border-color .14s ease-out,background-color .14s ease-out,color var(--t-theme),border-radius var(--t-theme);display:flex;flex-direction:column;content-visibility:auto;contain-intrinsic-size:0 300px}
  .card:hover{border-color:color-mix(in srgb,var(--ink) 22%,transparent);background:color-mix(in srgb,var(--ink) 2.5%,var(--panel))}
  .card:active{border-color:color-mix(in srgb,var(--ink) 28%,transparent)}
  .card:focus-visible,.ldb-card:focus-visible,.sw:focus-visible,.icon-card:focus-visible{outline:none;border-color:color-mix(in srgb,var(--ink) 38%,transparent)}
  .stage{height:168px;padding:13px 14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .mini{width:100%;padding:12px 13px;display:flex;flex-direction:column;gap:11px;overflow:hidden}
  .mini-head{display:flex;align-items:center;gap:9px;min-width:0}
  .mini-glyph{width:36px;height:36px;flex:none;display:inline-flex;align-items:center;justify-content:center;line-height:1;letter-spacing:-.02em}
  .mini-type{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .mini-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
  .mini-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .mini-row{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
  .strip{display:flex;height:9px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);transition:border-color var(--t-theme)}
  .strip i{flex:1}
  .card-body{padding:13px 15px 14px;display:flex;flex-direction:column;flex:1}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .card-top h2{font-size:14px;font-weight:560;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vtag{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:var(--sans);font-weight:500;letter-spacing:0;color:var(--dim2);flex:none}
  .vtag svg{width:11px;height:11px;flex:none;opacity:.85}
  .vtag.ok{color:var(--dim)}
  .vtag.warn{color:var(--warn);font-family:var(--mono);font-size:10.5px}
  .card-desc{font-size:12px;color:var(--dim);line-height:1.48;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
  .card-foot{margin-top:auto;padding-top:9px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;font-size:11px;color:var(--dim2);font-family:var(--mono);font-variant-numeric:tabular-nums;transition:border-color var(--t-theme)}
  .card-foot b{color:var(--dim);font-weight:500}
  .card-meta-right{display:inline-flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
  .star-pill{display:inline-flex;align-items:center;gap:3.5px;color:var(--ink);font-weight:500}
  .star-pill svg{width:11px;height:11px;color:var(--warn)}
  .repo-link{display:inline-flex;align-items:center;gap:3px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;transition:color var(--t-ui)}
  .repo-link:hover{color:var(--ink)}
  .repo-link svg{width:10px;height:10px;flex:none;opacity:.7}

  /* ---------- pagination ---------- */
  .pager{display:flex;justify-content:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);transition:border-color var(--t-theme)}
  .rk-loadmore{align-items:center;gap:10px;flex-wrap:wrap}
  .rk-load-meta{font-size:12px;color:var(--dim2);font-variant-numeric:tabular-nums;padding:0 4px}
  .pager-pages{display:inline-flex;align-items:center;gap:4px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 3%,transparent);border:1px solid var(--line);transition:background-color var(--t-theme),border-color var(--t-theme)}
  .pager-btn{min-width:30px;height:28px;padding:0 9px;border-radius:999px;color:var(--dim);font-size:11.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:color .12s ease-out,background-color .12s ease-out}
  .pager-btn svg{width:12px;height:12px}
  .pager-btn:hover:not(:disabled){color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
  .pager-btn:active:not(:disabled){background:color-mix(in srgb,var(--ink) 11%,transparent)}
  .pager-btn[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:600}
  .pager-btn[aria-current="page"]:hover{background:color-mix(in srgb,var(--ink) 90%,var(--bg));color:var(--bg)}
  .pager-btn:disabled{opacity:.32;cursor:default}
  .pager-dots{color:var(--dim2);font-size:11px;padding:0 4px}

  /* ---------- ranking leaderboard ---------- */
  .cov-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
  .cov-sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 15px;font-size:11.5px;color:var(--dim2);transition:background-color var(--t-theme),border-color var(--t-theme),color var(--t-theme)}
  .cov-sum b{display:block;font-size:20px;font-weight:600;color:var(--ink);font-family:var(--display);letter-spacing:-.025em;margin-bottom:2px;font-variant-numeric:tabular-nums}
  .rk-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .rk-table{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);transition:background-color var(--t-theme),border-color var(--t-theme)}
  .rk-head{display:grid;grid-template-columns:54px minmax(220px,1.6fr) 160px 120px 130px minmax(140px,1fr);gap:14px;padding:9px 16px;font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--dim2);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--ink) 2%,transparent)}
  .rk-row{display:grid;grid-template-columns:54px minmax(220px,1.6fr) 160px 120px 130px minmax(140px,1fr);gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color var(--t-ui),border-color var(--t-theme);content-visibility:auto;contain-intrinsic-size:0 54px}
  .rk-row:last-child{border-bottom:0}
  .rk-row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
  .rk-num{font-family:var(--mono);font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .rk-name{display:flex;align-items:center;gap:11px;min-width:0}
  .rk-swatch{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid rgba(255,255,255,.14);font-weight:650;font-size:11px}
  .rk-title{display:flex;flex-direction:column;gap:1.5px;min-width:0}
  .rk-title b{font-size:13.5px;font-weight:560;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk-repo{font-size:11px;font-family:var(--mono);color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk-repo a{display:inline-flex;align-items:center;gap:3px;transition:color var(--t-ui)}
  .rk-repo a:hover{color:var(--ink)}
  .rk-repo svg{width:10px;height:10px;opacity:.7}
  .rk-org{display:inline-flex;align-items:center;padding:3.5px 9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .rk-stars{display:inline-flex;align-items:center;gap:5px;padding:3.5px 9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);font-size:11.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);width:fit-content}
  .rk-stars svg{width:11px;height:11px;color:var(--warn)}
  .rk-npm{font-family:var(--mono);font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .rk-fws{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .fw-ico{height:22px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);font-size:10.5px;font-family:var(--mono);color:var(--dim)}
  .fw-ico svg{width:11px;height:11px;flex:none}
  @media (max-width:960px){
    .rk-head{display:none}
    .rk-row{grid-template-columns:42px 1fr auto;gap:10px}
    .rk-org,.rk-npm{display:none}
  }

  /* ---------- coverage ---------- */
  .cov-sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:20px}
  .cov-src-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:flex;flex-direction:column;gap:7px;transition:background-color var(--t-theme),border-color var(--t-theme)}
  .cov-src-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12px}
  .cov-src-top b{font-weight:560;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cov-src-top span{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums;flex:none}
  .cov-src-bar{height:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}
  .cov-src-bar i{display:block;height:100%;border-radius:999px;background:color-mix(in srgb,var(--ok) 75%,var(--ink) 25%)}
  .cov-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);transition:background-color var(--t-theme),border-color var(--t-theme)}
  .cov-row{display:grid;grid-template-columns:190px 1fr 150px 64px;gap:14px;align-items:center;padding:9px 15px;border-bottom:1px solid var(--line);font-size:12.5px;transition:background-color var(--t-ui),border-color var(--t-theme)}
  .cov-row:last-child{border-bottom:0}
  .cov-row.have:hover{background:color-mix(in srgb,var(--ink) 4%,transparent);cursor:pointer}
  .cov-org{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cov-sys{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cov-src{color:var(--dim2);font-size:11.5px;font-family:var(--sans)}

function pick(p,kind){ return p.components.filter(c=>c.kind===kind); }

function rgbChroma(p){
  return p ? Math.max(p[0],p[1],p[2])-Math.min(p[0],p[1],p[2]) : 999;
}
function cleanFontLabel(ff){
  if(!ff) return 'System UI';
  const first=String(ff).split(',')[0].replace(/['"]/g,'').trim();
  if(!first||/^-apple-system|BlinkMacSystemFont|system-ui|ui-sans-serif$/i.test(first)) return 'System UI';
  if(/^(sans-serif|inherit)$/i.test(first)) return 'System Sans';
  if(/^(ui-monospace|SFMono-Regular|monospace)$/i.test(first)) return 'System Mono';
  if(/^(ui-serif|serif)$/i.test(first)) return 'System Serif';
  if(/^ms_sans_serif$/i.test(first)) return 'MS Sans Serif';
  return /^[a-z]/.test(first)&&!/[-_]/.test(first)?first.charAt(0).toUpperCase()+first.slice(1):first;
}
function scaledTracking(tok){
  const raw=String((tok&&tok.letterSpacing)||'').trim();
  if(!raw||raw==='normal') return 'normal';
  if(/em$/.test(raw)) return raw;
  const n=parseFloat(raw);
  if(!Number.isFinite(n)) return 'normal';
  const em=Math.max(-0.04,Math.min(0.06,n/Math.max(10,pxOf(tok))));
  return em.toFixed(3)+'em';
}
function isOpaqueEnough(v){
  const c=parseColor(cleanColor(v));
  return Boolean(c&&c[3]>=0.72);
}
function colorDist(a,b){
  const pa=parseColor(a), pb=parseColor(b);
  if(!pa||!pb) return 999;
  return Math.abs(pa[0]-pb[0])+Math.abs(pa[1]-pb[1])+Math.abs(pa[2]-pb[2]);
}
function stageFor(p){
  const d=displayType(p), t=bodyType(p);
  const canvasLum=lum(parseColor(p.canvas)||[255,255,255,1]);
  const cards=pick(p,'card').filter(c=>!/alert|banner|callout-dark|notice/i.test(c.key));
  const cardTok=cards.find(c=>{
    const bg=cleanColor(c.backgroundColor);
    if(!bg) return false;
    const pl=over(bg,p.canvas);
    return (lum(pl)>=0.36)===(canvasLum>=0.36) && rgbChroma(pl)<=32;
  })||null;
  const cardBg=cleanColor(cardTok&&cardTok.backgroundColor)||p.surface||p.canvas;
  const cardPlate=over(cardBg,p.canvas);
  const sameSurf=!parseColor(cardBg)||Math.abs(lum(cardPlate)-lum(parseColor(p.canvas)||[0,0,0,1]))<0.025;
  const rawCardBorder=cleanColor(cardTok&&cardTok.border);
  const cardShadow=cleanColor(cardTok&&cardTok.shadow)||'none';
  const cardBorder=(rawCardBorder&&rawCardBorder!=='none')?rawCardBorder:('1px solid '+(sameSurf?alpha(readable(p.text,cardPlate),0.16):p.border));
  const cardRad=thumbRadius((cardTok&&cardTok.rounded)||p.radius,16,false);
  const glyphRad=thumbRadius(p.radius,11,false);
  const titleInk=readable(cleanColor(cardTok&&cardTok.textColor)||p.text,cardPlate);
  const mutedInk=readable(p.muted,cardPlate);
  const dSize=Math.round(Math.min(Math.max(pxOf(d)*0.44,13),15));
  const bSize=10.5;

  const brandFill=cleanColor(p.brand)||readable(p.text,cardPlate);
  const brandPlate=over(brandFill,cardBg);
  const sameBrand=Math.abs(lum(brandPlate)-lum(cardPlate))<0.08&&rgbChroma(brandPlate)<25;
  const tileBg=sameBrand?readable(p.text,cardPlate):brandFill;
  const tilePlate=over(tileBg,cardBg);
  const tileInk=readable(ink(tilePlate),tilePlate);
  const tileBorder=((rgbChroma(tilePlate)<35&&Math.abs(lum(tilePlate)-lum(cardPlate))<0.14)||(lum(tilePlate)>0.72&&lum(cardPlate)>=0.36))?('1px solid '+p.border):'none';

  const dispName=cleanFontLabel(d.fontFamily);
  const bodyName=cleanFontLabel(t.fontFamily);
  const typeMeta=(bodyName.toLowerCase()!==dispName.toLowerCase())
    ? bodyName+' \u00b7 '+Math.round(pxOf(d))+'/'+Math.round(pxOf(t))+'px'
    : 'w'+(d.fontWeight||600)+' \u00b7 '+Math.round(pxOf(d))+'/'+Math.round(pxOf(t))+'px';

  const rawBtns=pick(p,'button').filter(b=>cleanColor(b.backgroundColor)||cleanColor(b.textColor)||cleanColor(b.border));
  const contrastBtns=rawBtns.filter(b=>{
    const bg=cleanColor(b.backgroundColor);
    const c=parseColor(bg);
    return c&&c[3]>0.25&&Math.abs(lum(over(bg,cardBg))-lum(cardPlate))>0.08;
  });
  const ghostBtns=rawBtns.filter(b=>{
    const bg=cleanColor(b.backgroundColor);
    const c=parseColor(bg);
    return !c||c[3]<=0.25||Math.abs(lum(over(bg,cardBg))-lum(cardPlate))<=0.08;
  });
  const chosen=[];
  const primaryBtn=contrastBtns.find(b=>/primary|brand|cta/i.test(b.key))||contrastBtns[0];
  if(primaryBtn) chosen.push(primaryBtn);
  if(ghostBtns.length) chosen.push(ghostBtns[0]);
  else if(contrastBtns.length>1) chosen.push(contrastBtns[1]);
  else if(!chosen.length&&rawBtns.length) chosen.push(rawBtns[0]);
  if(!chosen.length) chosen.push({key:'button-primary',backgroundColor:p.brand});

  const badges=pick(p,'badge');
  const brandKey=(cleanColor(tileBg)||'').toLowerCase();
  const badgeTok=badges.find(b=>{
    const c=cleanColor(b.backgroundColor);
    return c&&c.toLowerCase()!==brandKey&&isOpaqueEnough(c);
  })||badges[0];

  const inputs=pick(p,'input');
  const used=new Set();
  const row=[renderInput(p,inputs[0],true,cardBg)];
  chosen.slice(0,2).forEach(c=>row.push(renderButton(p,c,true,used,cardBg)));

  const boxStyle=[
    'background:'+safeCss(cardBg),
    'border:'+safeCss(cardBorder),
    'border-radius:'+safeCss(cardRad),
    'box-shadow:'+safeCss(cardShadow)
  ].join(';');

  const glyphStyle=[
    'background:'+safeCss(tileBg),
    'color:'+safeCss(tileInk),
    'border:'+safeCss(tileBorder),
    'border-radius:'+safeCss(glyphRad),
    'font-family:'+fontStack(d.fontFamily),
    'font-size:16px',
    'font-weight:'+(d.fontWeight||700)
  ].join(';');

  return '<div class="mini" style="'+boxStyle+'">'+
    '<div class="mini-head">'+
      '<span class="mini-glyph" style="'+glyphStyle+'">Aa</span>'+
      '<div class="mini-type">'+
        '<div class="mini-title" style="font-family:'+fontStack(d.fontFamily)+';font-size:'+dSize+'px;font-weight:'+(d.fontWeight||600)+';letter-spacing:'+safeCss(scaledTracking(d))+';color:'+safeCss(titleInk)+'">'+esc(dispName)+'</div>'+
        '<div class="mini-sub" style="font-family:'+fontStack(t.fontFamily)+';font-size:'+bSize+'px;font-weight:'+(t.fontWeight||400)+';color:'+safeCss(mutedInk)+'">'+esc(typeMeta)+'</div>'+
      '</div>'+
      renderBadge(p,badgeTok,true,cardBg)+
    '</div>'+
    '<div class="mini-row">'+row.join('')+'</div>'+
  '</div>';
}

function stripColors(p,max){
  const out=[];
  const push=(v,minDist=22)=>{
    const clean=cleanColor(v);
    if(!clean||!isOpaqueEnough(clean)||out.length>=max) return;
    if(out.some(x=>colorDist(x,clean)<minDist)) return;
    out.push(clean);
  };
  [p.brand,p.surface,p.text,p.canvas].forEach(v=>push(v,18));
  const rest=p.palette.map(c=>c.value).filter(isOpaqueEnough);
  const chromaFirst=rest.slice().sort((a,b)=>rgbChroma(parseColor(b))-rgbChroma(parseColor(a)));
  chromaFirst.forEach(v=>push(v,28));
  rest.forEach(v=>push(v,10));
  if(out.length<4) [p.brand,p.surface,p.text,p.canvas].forEach(v=>push(v,0));
  return out;
}

function sentence(s,n){
  if(!s) return 'A specimen rendered from this system\u2019s own tokens.';
  const first=String(s).split('\n')[0].replace(/\*\*([^*]+)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').trim();
  if(first.length<=n) return first;
  const cut=first.slice(0,n);
  const m=cut.match(/^[\s\S]*[.!?](?=\s)/);
  const out=m?m[0]:cut.replace(/\s+\S*$/,'');
  return /[.!?\u2026]$/.test(out.trim())?out.trim():out.trim()+'\u2026';
}

function buildPagerHtml(total,page,pageSize){
  const effSize=pageSize||24;
  const totalPages=Math.max(1,Math.ceil(total/effSize));
  if(totalPages<=1) return '';
  const curPage=Math.min(Math.max(1,page),totalPages);
  const pages=[];
  const pushPage=p=>pages.push('<button type="button" class="pager-btn" data-pg="'+p+'"'+(p===curPage?' aria-current="page"':'')+'>'+p+'</button>');
  if(totalPages<=9){
    for(let p=1;p<=totalPages;p++) pushPage(p);
  }else{
    pushPage(1);
    if(curPage>3) pages.push('<span class="pager-dots">\u2026</span>');
    const pStart=Math.max(2,curPage-1);
    const pEnd=Math.min(totalPages-1,curPage+1);
    for(let p=pStart;p<=pEnd;p++) pushPage(p);
    if(curPage<totalPages-2) pages.push('<span class="pager-dots">\u2026</span>');
    pushPage(totalPages);
  }
  return '<div class="pager">'+
    '<div class="pager-pages">'+
      '<button type="button" class="pager-btn" data-pg="'+(curPage-1)+'"'+(curPage<=1?' disabled':'')+'>'+ICONS.back+'Prev</button>'+
      pages.join('')+
      '<button type="button" class="pager-btn" data-pg="'+(curPage+1)+'"'+(curPage>=totalPages?' disabled':'')+'>Next'+ICONS.next+'</button>'+
    '</div>'+
  '</div>';
}

function bindPager(container){
  if(!container) return;
  container.querySelectorAll('[data-pg]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=Number(btn.dataset.pg);
      if(!Number.isFinite(p)||p<1) return;
      if(p===state.page){
        if(window.scrollY>40) window.scrollTo({top:0,behavior:'smooth'});
        return;
      }
      state.page=p;
      runViewTransition('page',()=>{ window.scrollTo(0,0); renderIndex(); },grid);
    });
  });
}

function fmtNum(n){
  const v=Number(n||0);
  if(!v) return '\u2014';
  if(v>=1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(v>=1e3) return (v/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  return String(v);
}
function shortRepo(u){
  if(!u) return '';
  const m=/(?:github\.com|bitbucket\.org)\/([^/]+\/[^/#?]+)/i.exec(u);
  return m?m[1]:u.replace(/^https?:\/\/(www\.)?/,'');
}

function matches(d){
  if(state.filter==='popular' && !d.stars && !d.npmDownloads && !d.repo) return false;

function renderIndex(){
  const list=DATA.filter(matches).slice();
  if(state.filter==='popular'){

  const total=list.length;

  if(state.page>totalPages) state.page=1;

function contrastNote(fgRaw,bgRaw,canvasRaw){
  const fg=parseColor(fgRaw),bg=parseColor(bgRaw),cv=parseColor(canvasRaw)||[255,255,255,1];
  if(!fg||!bg) return '';
  const bgFlat=over(bgRaw,canvasRaw);
  const fgFlat=over(fgRaw,bgFlat);
  return ratio(fgFlat,bgFlat).toFixed(1)+':1';
}
function systemContextFor(d){
  const brandInk=readable(ink(d.brand),d.brand);
  const shadows=(d.components||[]).map(c=>c.shadow).filter(s=>s&&s!=='none');
  const paddings=[...new Set((d.components||[]).map(c=>c.padding).filter(Boolean))].slice(0,6);
  const disp=displayType(d), body=bodyType(d);
  return {
    onBrandInk: brandInk,
    textContrast: contrastNote(d.text,d.canvas,d.canvas),
    brandContrast: contrastNote(brandInk,d.brand,d.canvas),
    elevation: shadows.length
      ? 'shadow-layered ('+shadows[0]+') with hairline borders'

/* ---------- theme chameleon ---------- */
const THEME_VARS=['--bg','--panel','--panel2','--line','--line2','--ink','--dim','--dim2','--accent','--accent-fg','--card-radius','--header-bg','--ds-c1','--ds-c2','--ds-c3','--sb-accent'];
function systemBrandSlabs(d,canvasRgb,inkCol){
  const candidates=[d.brand,...(d.palette||[]).map(p=>p.value)].filter(Boolean);
  const picks=[];
  const seen=new Set();
  for(const raw of candidates){
    const parsed=parseColor(raw);
    if(!parsed) continue;
    const rgb=parsed[3]<1?over(parsed,canvasRgb):parsed;
    const key=rgb.slice(0,3).map(v=>Math.round(v)).join(',');
    if(seen.has(key)) continue;
    const cr=ratio(rgb,canvasRgb);
    if(cr<1.55) continue;
    const spread=Math.max(rgb[0],rgb[1],rgb[2])-Math.min(rgb[0],rgb[1],rgb[2]);
    picks.push({col:raw,rgb,score:spread+Math.min(cr,6)*6});
    seen.add(key);
  }
  picks.sort((a,b)=>b.score-a.score);
  const distinct=[];
  for(const p of picks){
    const far=distinct.every(q=>{
      const dr=p.rgb[0]-q.rgb[0],dg=p.rgb[1]-q.rgb[1],db=p.rgb[2]-q.rgb[2];
      return Math.hypot(dr,dg,db)>=42;
    });
    if(far||!distinct.length) distinct.push(p);
    if(distinct.length>=3) break;
  }
  const chosen=distinct.length>=3?distinct:picks;
  const c1=(chosen[0]&&chosen[0].col)||readable(d.brand,canvasRgb)||inkCol;
  const c2=(chosen[1]&&chosen[1].col)||('color-mix(in srgb, '+c1+' 70%, '+inkCol+')');
  const c3=(chosen[2]&&chosen[2].col)||('color-mix(in srgb, '+c1+' 42%, '+inkCol+')');
  return [c1,c2,c3];
}
function applySystemTheme(d){
  if(!d||d.provenance==='listed'){ resetSystemTheme(); return; }
  const rootEl=document.documentElement;
  rootEl.classList.add('sys-active');
  const cRgb=parseColor(d.canvas)||[255,255,255,1];
  const isDark=lum(cRgb)<0.36;
  rootEl.classList.toggle('sys-light',!isDark);
  const inkCol=readable(d.text,d.canvas);
  const dimCol=readable(d.muted,d.canvas);
  const panelCol=(d.surface&&d.surface!==d.canvas)?d.surface:(isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.03)');
  const panel2Col=isDark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)';
  const lineCol=d.border||(isDark?'rgba(255,255,255,0.12)':'rgba(0,0,0,0.1)');
  const line2Col=isDark?'rgba(255,255,255,0.22)':'rgba(0,0,0,0.2)';
  const cardRad=parseFloat(d.radius)>=20?'14px':(d.radius||'10px');
  const [ds1,ds2,ds3]=systemBrandSlabs(d,cRgb,inkCol);
  rootEl.style.setProperty('--bg',d.canvas);
  rootEl.style.setProperty('--panel',panelCol);
  rootEl.style.setProperty('--panel2',panel2Col);
  rootEl.style.setProperty('--line',lineCol);
  rootEl.style.setProperty('--line2',line2Col);
  rootEl.style.setProperty('--ink',inkCol);
  rootEl.style.setProperty('--dim',dimCol);
  rootEl.style.setProperty('--dim2',alpha(inkCol,0.55));
  rootEl.style.setProperty('--accent',d.brand);
  rootEl.style.setProperty('--accent-fg',readable(ink(d.brand),d.brand));
  rootEl.style.setProperty('--card-radius',cardRad);
  rootEl.style.setProperty('--header-bg',alpha(d.canvas,0.86));
  rootEl.style.setProperty('--ds-c1',ds1);
  rootEl.style.setProperty('--ds-c2',ds2);
  rootEl.style.setProperty('--ds-c3',ds3);
  rootEl.style.setProperty('--sb-accent',readable(d.brand||ds1,d.canvas));
}
function resetSystemTheme(){
  const rootEl=document.documentElement;
  rootEl.classList.remove('sys-active','sys-light');
  THEME_VARS.forEach(v=>rootEl.style.removeProperty(v));
}

function detailHtml(d){

      .filter(Boolean).join('<br>')||'inherits palette';

  function renderFor(c){
    if(c.kind==='input') return renderInput(d,c);
    if(c.kind==='select') return renderSelect(d,c);
    if(c.kind==='checkbox') return renderCheckbox(d,c);
    if(c.kind==='radio') return renderRadio(d,c);
    if(c.kind==='switch') return renderSwitch(d,c);
    if(c.kind==='badge') return renderBadge(d,c);
    if(c.kind==='button') return renderButton(d,c,false);
    if(c.kind==='alert') return renderAlert(d,c);
    if(c.kind==='tabs'||c.kind==='tab') return renderTabs(d,c);
    if(c.kind==='nav') return renderNavSpecimen(d,c);
    if(c.kind==='card'||c.kind==='panel') return renderCardSpecimen(d,c);
    if(c.kind==='table') return renderTableSpecimen(d,c);
    if(c.kind==='tooltip'||c.kind==='modal') return renderTooltipSpecimen(d,c);
    if(c.kind==='progress') return renderProgressSpecimen(d,c);
    if(c.kind==='avatar') return renderAvatarSpecimen(d,c);
    if(c.kind==='link') return renderLinkSpecimen(d,c);
    if(c.kind==='icon') return renderIconSpecimen(d,c);
    return renderSurface(d,c);
  }

  const items=hasComps
    ? d.components.map(c=>({demo:renderFor(c),bg:stageBg(d,c),name:labelOf(c.key),sub:c.key,props:propList(c)}))
    : [
        {demo:renderButton(d,{key:'button-primary',backgroundColor:d.brand},false),bg:d.canvas,name:'Button',sub:'derived',props:'brand fill + body type'},
        {demo:renderInput(d),bg:d.canvas,name:'Input',sub:'derived',props:'surface + border + radius'},
        {demo:renderBadge(d),bg:d.canvas,name:'Badge',sub:'derived',props:'text tint + radius'},
        {demo:renderCardBox(d),bg:d.canvas,name:'Card',sub:'derived',props:'surface + border + radius'}
      ];

  const comps=items.map(it=>
    '<div class="comp"><div class="comp-stage" style="background:'+safeCss(it.bg)+'">'+it.demo+'</div>'+
    '<div class="comp-info"><b>'+esc(it.name)+'</b><span>'+esc(it.sub)+'</span><br>'+it.props+'</div></div>'
  ).join('');

  const swatches=d.palette.map(c=>
    '<div class="sw" data-copy="'+esc(c.value)+'"><i style="background:'+safeCss(c.value)+'"></i>'+
    '<div><b>'+esc(c.name)+'</b><span>'+esc(c.value)+'</span></div></div>').join('');

  const types=d.type.map(t=>{
    const size=Math.min(pxOf(t),34);
    const isMono=/mono|code|console|pre|courier|menlo|consolas/i.test((t.name||'')+' '+(t.fontFamily||''));
    const isDisp=!isMono&&(pxOf(t)>=20||/display|heading|headline|title|hero|^h[1-6]\b/i.test(t.name||''));
    const demoCls=isMono?'type-demo is-code':(isDisp?'type-demo is-display':'type-demo');
    return '<div class="type-row"><div class="type-spec"><b>'+esc(t.name)+'</b>'+
      (t.fontSize?pxOf(t)+'px ':'')+esc(t.fontWeight||'')+(t.lineHeight?' / '+esc(t.lineHeight):'')+'</div>'+
      '<div class="'+demoCls+'" style="font-family:'+fontStack(t.fontFamily)+';font-size:'+size+'px;font-weight:'+
      safeCss(t.fontWeight||400)+';letter-spacing:'+safeCss(scaledTracking(t))+';line-height:1.2">The quick brown fox jumps over the lazy dog</div></div>';
  }).join('');

  function inlineMd(s){
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/`([^`]+)`/g,'<code>$1</code>');
  }
  function renderMd(raw){
    if(!raw) return '';
    const lines=String(raw).split(/\r?\n/);
    const out=[];
    let listTag=null;
    const closeList=()=>{ if(listTag){ out.push('</'+listTag+'>'); listTag=null; } };
    for(const ln of lines){
      const t=ln.trim();
      if(!t){ closeList(); continue; }
      if(/^#{2,4}\s+/.test(t)){
        closeList();
        out.push('<h4>'+inlineMd(t.replace(/^#{2,4}\s+/,''))+'</h4>');
      }else if(/^[-*]\s+/.test(t)){
        if(listTag!=='ul'){ closeList(); out.push('<ul>'); listTag='ul'; }
        out.push('<li>'+inlineMd(t.replace(/^[-*]\s+/,''))+'</li>');
      }else if(/^\d+\.\s+/.test(t)){
        if(listTag!=='ol'){ closeList(); out.push('<ol>'); listTag='ol'; }
        out.push('<li>'+inlineMd(t.replace(/^\d+\.\s+/,''))+'</li>');
      }else{
        closeList();
        out.push('<p>'+inlineMd(t)+'</p>');
      }
    }
    closeList();
    return out.join('');
  }
  const notes=[renderMd(d.overview),renderMd(d.dos)].filter(Boolean).join('');
  const backLabel=state.view==='ranking'?'Ranking':state.view==='coverage'?'Coverage':'Catalog';

  const ic=iconSpecOf(d);
  const iconCol=readable(d.text,d.canvas);
  const iconAccent=readable(d.brand,d.canvas);
  const officialPack=ic.pack&&ICON_PACKS[ic.pack];
  let iconTiles=[];
  if(officialPack&&officialPack.glyphs&&officialPack.glyphs.length){
    officialPack.glyphs.forEach((g,idx)=>iconTiles.push({
      name:g.name,
      tag:'official svg',
      svg:buildSysSvg(ic,g,28,idx%5===4?iconAccent:iconCol),
      copySvg:buildSysSvg(ic,g,officialPack.grid||ic.grid||24,'currentColor',true)
    }));
  }else if(ic.samples&&ic.samples.length){
    ic.samples.forEach((s,idx)=>iconTiles.push({
      name:s.name,
      tag:ic.source==='repo'?'repo svg':ic.source==='npm'?'npm svg':'extracted svg',
      svg:buildSysSvg(ic,s,28,idx%5===4?iconAccent:iconCol),
      copySvg:buildSysSvg(ic,s,ic.grid||24,'currentColor',true)
    }));
  }
  const safeIconUrl=/^https?:\/\//i.test(ic.url||'')?ic.url:null;
  const iconBodyHtml=iconTiles.length
    ? '<div class="icon-grid">'+iconTiles.map(t=>
        '<div class="icon-card" data-copy-svg="'+esc(t.copySvg)+'" data-icon-name="'+esc(t.name)+'">'+
          '<span class="icon-glyph" style="background:'+safeCss(d.surface)+'">'+t.svg+'</span>'+
          '<span class="icon-name">'+esc(t.name)+'</span>'+
          '<span class="icon-sub">'+esc(t.tag)+'</span>'+
        '</div>'
      ).join('')+'</div>'
    : '<div class="icon-bar" style="margin-top:8px;justify-content:flex-start;gap:14px">'+
        '<div style="width:42px;height:42px;flex-shrink:0;border-radius:'+safeCss(thumbRadius(d.radius,10))+';border:'+(ic.style==='solid'?'2px solid ':'1.5px dashed ')+safeCss(iconAccent)+';display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:'+safeCss(iconAccent)+'">'+ic.grid+'px</div>'+
        '<div style="display:flex;flex-direction:column;gap:3px;min-width:0">'+
          '<span style="font-size:12.5px;font-weight:500">No bundled public SVG package \u2014 follows documented '+esc(ic.library)+' specification ('+ic.grid+'\u00d7'+ic.grid+' grid, '+(ic.style==='solid'?'solid fill':ic.strokeWidth+'px stroke, '+ic.strokeLinecap+' caps')+').</span>'+
          '<span class="icon-sub" style="font-size:11px;opacity:.75">Generic placeholder glyphs are omitted so every system displays only its authentic icons.</span>'+
        '</div>'+
      '</div>';
  const iconRightNote=officialPack
    ? (officialPack.package+'@'+officialPack.version+' · official package SVGs · click to copy SVG')
    : (iconTiles.length
      ? (ic.grid+'px grid · '+iconTiles.length+' harvested SVGs · click to copy SVG')
      : (ic.grid+'px grid · '+(ic.style==='solid'?'solid':'outline '+ic.strokeWidth+'px')+' · external / proprietary spec'));
  const iconSecHtml='<div class="sec"><div class="sec-h"><h2>Iconography &amp; SVG System</h2><em>'+esc(iconRightNote)+'</em></div>'+
    '<div class="icon-bar">'+
      '<div class="icon-bar-info">'+
        '<span class="icon-bar-title">'+esc(ic.library)+'</span>'+
        (ic.package?'<span class="kind"><b>pkg</b> '+esc(ic.package)+'</span>':'')+
        (officialPack?'<span class="kind"><b>svgs</b> '+officialPack.package+'@'+esc(officialPack.version)+'</span>':'')+
        '<span class="kind"><b>grid</b> '+ic.grid+'\u00d7'+ic.grid+'</span>'+
        '<span class="kind"><b>style</b> '+esc(ic.style)+(ic.style!=='solid'?' \u00b7 '+ic.strokeWidth+'px':'')+'</span>'+
        '<span class="kind"><b>caps</b> '+esc(ic.strokeLinecap)+' / '+esc(ic.strokeLinejoin)+'</span>'+
        '<span class="kind"><b>source</b> '+esc(ic.source)+'</span>'+
      '</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
        (ic.package?'<button type="button" class="pill-btn" data-copy="npm install '+esc(ic.package)+'">'+ICONS.copy+'npm i '+esc(ic.package)+'</button>':'')+
        (safeIconUrl?'<a class="pill-btn" href="'+esc(safeIconUrl)+'" target="_blank" rel="noopener">Docs '+ICONS.ext+'</a>':'')+
      '</div>'+
    '</div>'+
    iconBodyHtml+'</div>';

  return '<div class="detail-bar">'+
      '<div class="detail-nav">'+
        '<a class="pill-btn" href="#" data-back>'+ICONS.back+backLabel+'</a>'+
        '<span class="detail-title" style="font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.02em;margin-left:4px">'+esc(d.name)+'</span>'+
        (d.org?'<span class="meta-pill">'+esc(d.org)+'</span>':'')+
        '<span class="meta-pill">'+esc(d.license)+'</span>'+
        (d.stars?'<span class="meta-pill">'+ICONS.star+fmtNum(d.stars)+'</span>':'')+
        (d.npmDownloads?'<span class="meta-pill">'+ICONS.pkg+fmtNum(d.npmDownloads)+'/mo</span>':'')+
      '</div>'+
      '<div class="detail-actions">'+
        (d.repo?'<a href="'+esc(d.repo)+'" target="_blank" rel="noopener" class="pill-btn">'+ICONS.gh+esc(shortRepo(d.repo))+ICONS.ext+'</a>':'')+
        (d.provenance!=='listed'?'<a href="./studio/#/systems?seed='+encodeURIComponent(d.slug)+'" class="pill-btn">Remix in Studio'+ICONS.ext+'</a>':'')+
        '<button type="button" class="pill-btn primary" data-copy-prompt>'+ICONS.copy+'Copy Prompt</button>'+
        '<button type="button" class="pill-btn" data-copy-json>'+ICONS.copy+'JSON</button>'+
      '</div>'+
    '</div>'+
    heroFor(d)+
    '<div class="sec"><div class="sec-h"><h2>Component Tokens</h2><em>'+d.components.length+' tokens across '+Object.keys(kinds).length+' canonical kinds</em></div>'+
      '<div class="kinds">'+kindChips+'</div>'+
      '<div class="comp-grid">'+comps+'</div></div>'+
    iconSecHtml+
    '<div class="sec"><div class="sec-h"><h2>Colour Palette</h2><em>'+d.palette.length+' tokens \u00b7 click any swatch to copy</em></div>'+
      '<div class="swatches">'+swatches+'</div></div>'+
    (d.type.length
      ? '<div class="sec"><div class="sec-h"><h2>Typography Scale</h2><em>'+d.type.length+' steps</em></div>'+
        '<div class="sheet" style="background:'+safeCss(d.canvas)+';color:'+safeCss(readable(d.text,d.canvas))+'">'+types+'</div></div>'
      : '')+
    (notes?'<div class="sec notes"><div class="sec-h"><h2>Visual Language &amp; Guidelines</h2><em>architecture &amp; usage</em></div>'+notes+'</div>':'')+
    '<div class="sec"><div class="sec-h"><h2>CLI &amp; Agent Prompt</h2><em>install, inspect, or copy complete system specification</em></div>'+
      '<div class="cmd-stack">'+
        '<div class="cmd"><code>npx sourcebook add '+esc(d.slug)+' --framework prompt --print</code>'+
        '<button class="pill-btn" data-copy="npx sourcebook add '+esc(d.slug)+' --framework prompt --print">'+ICONS.copy+'Copy CLI</button></div>'+
        '<div class="cmd"><code>npx sourcebook info '+esc(d.slug)+'</code>'+
        '<button class="pill-btn" data-copy="npx sourcebook info '+esc(d.slug)+'">'+ICONS.copy+'Copy Info</button></div>'+
        '<details class="prompt-box"><summary>Inspect full agent prompt ('+d.palette.length+' colors \u00b7 '+d.type.length+' type \u00b7 '+d.components.length+' components)</summary>'+
          '<pre>'+esc(agentPromptFor(d))+'</pre>'+
        '</details>'+
      '</div></div>';
}

/* ---------- transitions & loader ---------- */
let loaderT, activeVT=null, navToken=0;
function startLoader(){
  const el=document.getElementById('topLoader');
  if(el) el.classList.add('on');
  clearTimeout(loaderT);
}
function stopLoader(){
  clearTimeout(loaderT);
  loaderT=setTimeout(()=>{
    const el=document.getElementById('topLoader');
    if(el) el.classList.remove('on');
  },80);
}
function pulseEnter(el){
  if(!el) return;
  el.classList.remove('fade-in');
  void el.offsetWidth;
  el.classList.add('fade-in');
}
function clearVtClasses(){
  const r=document.documentElement;
  r.classList.remove('vt-snap');
  delete r.dataset.vtKind;
}
function runViewTransition(kind,updateFn,fallbackEl){
  const r=document.documentElement;
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(activeVT){
    try{ activeVT.skipTransition(); }catch(_){}
    activeVT=null;
  }
  clearVtClasses();
  if(reduced||typeof document.startViewTransition!=='function'){
    updateFn();
    if(!reduced&&fallbackEl) pulseEnter(fallbackEl);
    return Promise.resolve();
  }
  r.dataset.vtKind=kind;
  r.classList.add('vt-snap');
  let vt;
  try{
    vt=document.startViewTransition(()=>updateFn());
  }catch(_){
    clearVtClasses();
    updateFn();
    if(fallbackEl) pulseEnter(fallbackEl);
    return Promise.resolve();
  }
  activeVT=vt;
  vt.ready.then(()=>{ r.classList.remove('vt-snap'); },clearVtClasses);
  const done=()=>{
    if(activeVT===vt){
      activeVT=null;
      clearVtClasses();
    }
  };
  return vt.finished.then(done,done);
}
function bindDetailEvents(d){
  const backEl=detail.querySelector('[data-back]');
  if(backEl) backEl.addEventListener('click',e=>{
    e.preventDefault();
    location.hash='';
  });
  detail.querySelectorAll('[data-copy]').forEach(el=>{
    el.addEventListener('click',()=>copy(el.dataset.copy));
  });
  detail.querySelectorAll('[data-copy-svg]').forEach(el=>{
    el.addEventListener('click',()=>{
      navigator.clipboard.writeText(el.dataset.copySvg).then(()=>toast('Copied SVG icon: '+el.dataset.iconName),()=>toast('Copy failed'));
    });
  });
  detail.querySelectorAll('[data-demo-switch]').forEach(el=>{
    el.addEventListener('click',()=>{
      const on=el.getAttribute('aria-checked')!=='true';
      el.setAttribute('aria-checked',String(on));
      el.style.background=on?el.dataset.onBg:el.dataset.offBg;
      const k=el.querySelector('.demo-switch-knob');
      if(k){
        k.style.background=on?el.dataset.onKnob:el.dataset.offKnob;
        k.style.transform=on?'translateX(19px)':'translateX(0px)';
      }
    });
  });
  detail.querySelectorAll('[data-demo-check]').forEach(el=>{
    el.addEventListener('click',()=>{
      const on=el.getAttribute('aria-checked')!=='true';
      el.setAttribute('aria-checked',String(on));
      const box=el.querySelector('.demo-check-box');
      if(box){
        box.style.background=on?el.dataset.fill:'transparent';
        box.style.borderColor=on?el.dataset.fill:el.dataset.border;
        const svg=box.querySelector('svg');
        if(svg) svg.style.opacity=on?'1':'0';
      }
    });
  });
  detail.querySelectorAll('[data-pg-btn]').forEach(el=>{
    el.addEventListener('click',()=>toast('Triggered '+el.dataset.pgBtn));
  });
  const cpPrompt=detail.querySelector('[data-copy-prompt]');
  if(cpPrompt) cpPrompt.addEventListener('click',()=>{
    const full=FULL_CACHE[d.slug];
    copy((full&&full.designMd)?(agentPromptFor(d)+'\n\n---\n\n'+full.designMd):agentPromptFor(d));
  });
  const cpJson=detail.querySelector('[data-copy-json]');
  if(cpJson) cpJson.addEventListener('click',()=>{
    const full=FULL_CACHE[d.slug];
    const base=agentJsonFor(d);
    if(full&&full.tokens) base.fullTokens=full.tokens;
    copy(JSON.stringify(base,null,2));
  });
}
async function hydrateSystemDetail(slug){
  if(FULL_CACHE[slug]||!location.protocol.startsWith('http')) return;
  try{
    const res=await fetch('/api/systems/'+encodeURIComponent(slug));
    if(!res.ok) return;
    const j=await res.json();
    if(j&&j.ok&&j.system){
      FULL_CACHE[slug]=j.system;
      const curSlug=location.hash.replace(/^#\/?/,'');
      if(curSlug===slug){
        const liveD=DATA.find(x=>x.slug===slug);
        if(liveD){
          if(Number.isFinite(j.system.stars)) liveD.stars=j.system.stars;
          if(Number.isFinite(j.system.npmDownloads)) liveD.npmDownloads=j.system.npmDownloads;
        }
      }
    }
  }catch(_){}
}
async function renderDetail(slug,immediate){
  closeDsSelectMenu(false);
  const d=DATA.find(x=>x.slug===slug);
  if(!d){ location.hash=''; return; }
  hydrateSystemDetail(slug);
  ++navToken;
  const apply=()=>{
    applySystemTheme(d);
    index.style.display='none';
    logosEl.style.display='none';
    rankingEl.style.display='none';
    coverageEl.style.display='none';
    detail.classList.add('on');
    detail.innerHTML=detailHtml(d);
    bindDetailEvents(d);
    window.scrollTo(0,0);
  };
  if(immediate){ apply(); return; }
  await runViewTransition('chameleon',apply,detail);
}

function copy(text){
  navigator.clipboard.writeText(text).then(()=>toast('Copied '+text.slice(0,28)),()=>toast('Copy failed'));
}
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=ICONS.check+'<span>'+esc(msg)+'</span>';
  t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1400);
}

/* ---------- ranking ---------- */
const rankingEl=document.getElementById('ranking');

function repoKeyOf(url){
  if(!url) return null;
  const m=/^https?:\/\/github\.com\/([^/]+)\/([^/#?]+)/i.exec(String(url).trim());
  return m?(m[1]+'/'+m[2].replace(/\.git$/i,'')).toLowerCase():String(url).toLowerCase();
}
function dedupeByRepoList(rows){
  const seen=new Set();
  return rows.filter(d=>{
    const rk=repoKeyOf(d.repo);
    if(!rk) return true;
    if(seen.has(rk)) return false;
    seen.add(rk);
    return true;
  });
}
function renderRanking(){
  const q=state.q.toLowerCase();
  const mode=state.rkMode||'ds';
  const sorted=DATA.slice().sort((a,b)=>(b.stars||0)-(a.stars||0)||(b.npmDownloads||0)-(a.npmDownloads||0)||(a.name||'').localeCompare(b.name||''));
  const uniqueRepoSystems=dedupeByRepoList(sorted);
  let list=uniqueRepoSystems.filter(d=>{
    if(q && !(d.name+' '+d.org+' '+(d.repo||'')+' '+(d.package||'')+' '+d.style).toLowerCase().includes(q)) return false;
    if(mode==='enterprise') return Boolean(d.enterpriseRank);
    if(mode==='ds') return Boolean(d.isDesignSystemRepo);
    if(mode==='npm') return d.npmDownloads>0;
    return Boolean(d.repo || d.package || d.stars);
  }).slice();

  if(mode==='enterprise') list.sort((a,b)=>(a.enterpriseRank||999)-(b.enterpriseRank||999));
  else if(mode==='npm') list.sort((a,b)=>(b.npmDownloads||0)-(a.npmDownloads||0));
  else list.sort((a,b)=>(b.stars||0)-(a.stars||0)||(b.npmDownloads||0)-(a.npmDownloads||0));

  const total=list.length;
  const shownCount=Math.max(state.rkStep||24,state.rkShown||24);
  const endIdx=Math.min(total,shownCount);
  const visible=list.slice(0,endIdx);

  const rows=visible.map((d,i)=>{
    const org=d.org || (d.name.includes(' ') ? d.name.split(' ')[0] : d.slug);
    const repoLink=d.repo
      ? '<a href="'+esc(d.repo)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(shortRepo(d.repo))+ICONS.ext+'</a>'
      : (d.package ? '<span>npm: '+esc(d.package)+'</span>' : '<span>\u2014</span>');
    const init=(d.name||d.slug).slice(0,1).toUpperCase();
    const swFg=ink(d.brand||'#6366f1');
    return '<div class="rk-row" data-slug="'+esc(d.slug)+'">'+
      '<div class="rk-num">#'+(i+1)+'</div>'+
      '<div class="rk-name">'+
        '<span class="rk-swatch" style="background:'+safeCss(d.brand)+';color:'+safeCss(swFg)+'">'+esc(init)+'</span>'+
        '<div class="rk-title"><b>'+esc(d.name)+'</b>'+
        '<span class="rk-repo">'+repoLink+'</span></div>'+
      '</div>'+
      '<div><span class="rk-org">'+esc(org)+'</span></div>'+
      '<div><span class="rk-stars">'+ICONS.star+fmtNum(d.stars)+'</span></div>'+
      '<div class="rk-npm">'+(d.npmDownloads?fmtNum(d.npmDownloads)+'/mo':'\u2014')+'</div>'+
      '<div class="rk-fws">'+renderFwIcons(d.frameworks)+'</div>'+
    '</div>';
  }).join('');

  const withRepos=uniqueRepoSystems.filter(d=>d.repo).length;
  const totalStars=uniqueRepoSystems.reduce((a,d)=>a+(d.stars||0),0);
  const seenPkgs=new Set();
  const totalNpm=DATA.reduce((a,d)=>{
    if(!d.package||!d.npmDownloads||seenPkgs.has(d.package)) return a;
    seenPkgs.add(d.package);
    return a+d.npmDownloads;
  },0);
  const remaining=Math.max(0,total-endIdx);
  const nextStep=Math.min(state.rkStep||24,remaining);
  const loadMoreHtml=remaining>0
    ? '<div class="pager rk-loadmore">'+
        '<button type="button" class="pill-btn primary" id="rkLoadMore">Load '+nextStep+' more</button>'+
        (remaining>nextStep?'<button type="button" class="pill-btn" id="rkShowAll">Show all ('+total+')</button>':'')+
        '<span class="rk-load-meta">'+endIdx+' of '+total+' shown</span>'+
      '</div>'
    : (total>(state.rkStep||24)?'<div class="pager rk-loadmore"><span class="rk-load-meta">All '+total+' ranked systems shown</span></div>':'');

  rankingEl.innerHTML=
    '<div class="meta"><h1>Popularity Leaderboard</h1><em>'+(total?('1\u2013'+endIdx+' of '+total):'0')+'</em></div>'+
    '<div class="cov-sum">'+
      '<div><b>'+withRepos+'</b>unique repositories</div>'+
      '<div><b>'+fmtNum(totalStars)+'</b>GitHub stars</div>'+
      '<div><b>'+fmtNum(totalNpm)+'</b>monthly npm downloads</div>'+
      '<div><b>'+total+'</b>ranked in view</div>'+
    '</div>'+
    '<div class="rk-controls">'+
      '<div class="seg">'+
        '<button class="chip" data-rk="ds" aria-pressed="'+String(mode==='ds')+'">Design System Repos</button>'+
        '<button class="chip" data-rk="enterprise" aria-pressed="'+String(mode==='enterprise')+'">Featured Enterprise</button>'+
        '<button class="chip" data-rk="npm" aria-pressed="'+String(mode==='npm')+'">Most Downloaded (npm)</button>'+
        '<button class="chip" data-rk="all" aria-pressed="'+String(mode==='all')+'">All Linked ('+withRepos+')</button>'+
      '</div>'+
    '</div>'+
    '<div class="rk-table">'+
      '<div class="rk-head"><span>#</span><span>System &amp; Repository</span><span>Organization</span><span>Stars</span><span>npm / mo</span><span>Frameworks</span></div>'+
      rows+
    '</div>'+
    '<div id="rkPager">'+loadMoreHtml+'</div>';

  document.getElementById('rkLoadMore')?.addEventListener('click',()=>{
    const prevY=window.scrollY;
    state.rkShown=Math.min(total,(state.rkShown||24)+(state.rkStep||24));
    renderRanking();
    window.scrollTo({top:prevY,behavior:'instant'});
  });
  document.getElementById('rkShowAll')?.addEventListener('click',()=>{
    const prevY=window.scrollY;
    state.rkShown=total;
    renderRanking();
    window.scrollTo({top:prevY,behavior:'instant'});
  });
  rankingEl.querySelectorAll('[data-rk]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(state.rkMode===btn.dataset.rk) return;
      state.rkMode=btn.dataset.rk;
      state.rkShown=state.rkStep||24;
      runViewTransition('tab',()=>renderRanking(),rankingEl);
    });
  });
  rankingEl.querySelectorAll('.rk-row[data-slug]').forEach(el=>{
    const slug=el.dataset.slug;
    el.addEventListener('click',e=>{
      if(e.target.closest('a')) return;
      if(location.hash==='#/'+slug) renderDetail(slug,false);
      else location.hash='#/'+slug;
    });
  });
}

const coverageEl=document.getElementById('coverage');

function renderCoverage(){
  const entries=(COVERAGE.union&&COVERAGE.union.entries)||[];
  const q=state.q.toLowerCase();
  const list=entries.filter(e=>!q||(e.org+' '+e.systems.map(s=>s.name).join(' ')).toLowerCase().includes(q));
  const have=list.filter(e=>e.covered);
  const miss=list.filter(e=>!e.covered);

  const row=e=>{
    const names=[...new Set(e.systems.map(s=>s.name))].join(' \u00b7 ');
    const srcs=[...new Set(e.systems.map(s=>s.sourceId||s.source))].join(', ');
    const tag=e.covered
      ?'<span class="cov-tag in">sourced</span>'
      :(e.npm?'<span class="cov-tag npm">npm</span>'
      :(e.repo?'<span class="cov-tag repo">repo</span>':'<span class="cov-tag">docs</span>'));
    return '<div class="cov-row'+(e.covered?' have':'')+'"'+(e.covered?' data-slug="'+esc(e.covered)+'"':'')+'>'+
      '<span class="cov-org">'+esc(e.org)+'</span>'+
      '<span class="cov-sys">'+esc(names)+'</span>'+
      '<span class="cov-src">'+esc(srcs)+'</span>'+tag+'</div>';
  };

  const total=entries.length;
  const haveAll=entries.filter(e=>e.covered).length;
  const reachAll=entries.filter(e=>!e.covered&&e.npm).length;
  const repoAll=entries.filter(e=>!e.covered&&!e.npm&&e.repo).length;
  const srcCards=(COVERAGE.sources||[]).map(s=>{
    const pct=s.total?Math.round((s.covered/s.total)*100):0;
    return '<div class="cov-src-card">'+
      '<div class="cov-src-top"><b>'+esc(s.name.split(' (')[0])+'</b><span>'+s.covered+'/'+s.total+' \u00b7 '+pct+'%</span></div>'+
      '<div class="cov-src-bar"><i style="width:'+pct+'%"></i></div>'+
    '</div>';
  }).join('');

  coverageEl.innerHTML=
    '<div class="meta"><h1>Registry Coverage</h1><em>'+have.length+' of '+list.length+'</em></div>'+
    '<div class="cov-sum">'+
      '<div><b>'+haveAll+'/'+total+'</b>organisations sourced</div>'+
      '<div><b>'+(total-haveAll)+'</b>unindexed</div>'+
      '<div><b>'+reachAll+'</b>reachable via npm</div>'+
      '<div><b>'+repoAll+'</b>reachable via repo</div>'+
    '</div>'+
    (srcCards?'<div class="cov-sources">'+srcCards+'</div>':'')+
    (have.length?'<div class="cov-h">In Registry \u2014 '+have.length+'</div><div class="cov-list">'+have.map(row).join('')+'</div>':'')+
    (miss.length?'<div class="cov-h">Unindexed \u2014 '+miss.length+'</div><div class="cov-list">'+miss.map(row).join('')+'</div>':'');

  coverageEl.querySelectorAll('[data-slug]').forEach(el=>{
    el.addEventListener('click',()=>{location.hash='#/'+el.dataset.slug});
  });
}
