<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Sourcebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Geist:wght@300..700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300..700&family=Plus+Jakarta+Sans:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09090b; --panel:#101013; --panel2:#17171c;
    --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.15);
    --ink:#fafafa; --dim:#a1a1aa; --dim2:#71717a;
    --accent:#fafafa; --accent-fg:#09090b;
    --ok:#10b981; --warn:#f59e0b;
    --sans:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --display:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
    --sys-radius:999px; --card-radius:12px;
    --header-bg:rgba(9,9,11,.84);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color .2s ease,color .2s ease}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

  /* ---------- top progress loader ---------- */
  .top-loader{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;pointer-events:none;opacity:0;transition:opacity .15s}
  .top-loader.on{opacity:1}
  .top-loader::after{content:'';display:block;height:100%;width:38%;background:var(--ink);animation:loaderSlide .7s infinite cubic-bezier(.4,0,.2,1)}
  @keyframes loaderSlide{0%{transform:translateX(-100%)}100%{transform:translateX(270%)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulseSkel{0%,100%{opacity:.5}50%{opacity:.2}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeIn .16s ease-out}
  .spin{display:inline-block;width:12px;height:12px;border:1.6px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;border-radius:50%;animation:spin .55s linear infinite;vertical-align:-2px;margin-right:6px}

  /* ---------- header & segmented pills ---------- */
  header.top{position:sticky;top:0;z-index:30;background:var(--header-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);transition:background-color .2s ease,border-color .2s ease}
  .bar{max-width:1360px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px}
  .brand{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;cursor:pointer;padding:4px 2px;transition:opacity .15s}
  .brand:hover{opacity:.85}
  .brand svg{width:17px;height:17px;color:var(--ink);flex:none}
  .brand b{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}

  .search{flex:1;position:relative;max-width:340px;margin-left:6px}
  .search input{width:100%;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);border-radius:999px;padding:6.5px 34px 6.5px 32px;color:var(--ink);font-family:var(--sans);font-size:12.5px;outline:none;transition:border-color .14s,background-color .14s}
  .search input:focus{border-color:var(--line2);background:color-mix(in srgb,var(--ink) 6.5%,transparent)}
  .search input::placeholder{color:var(--dim2)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim2);pointer-events:none}
  .search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:10px var(--mono);color:var(--dim2);background:color-mix(in srgb,var(--ink) 5%,transparent);border:1px solid var(--line);border-radius:4px;padding:1px 5px;pointer-events:none}

  .seg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 3.5%,transparent);border:1px solid var(--line)}
  .seg-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500;color:var(--dim);border:1px solid transparent;transition:color .12s,background-color .12s,box-shadow .12s;white-space:nowrap}
  .chip svg{width:12px;height:12px;flex:none}
  .chip:hover{color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:550;box-shadow:0 1px 2px rgba(0,0,0,.28)}
  .pill-btn{display:inline-flex;align-items:center;gap:6px;padding:5.5px 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--dim);background:color-mix(in srgb,var(--ink) 3.5%,transparent);border:1px solid var(--line);transition:.12s;white-space:nowrap}
  .pill-btn svg{width:12px;height:12px;flex:none}
  .pill-btn:hover{color:var(--ink);border-color:var(--line2);background:color-mix(in srgb,var(--ink) 7%,transparent)}
  .pill-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:550}
  .pill-btn.primary:hover{opacity:.9}

  /* ---------- layout & subheader ---------- */
  main{max-width:1360px;margin:0 auto;padding:24px 24px 80px}
  .meta{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:28px}
  .meta h1{font-size:13px;font-weight:550;letter-spacing:-.01em;margin:0;color:var(--ink)}
  .meta em{font-style:normal;color:var(--dim2);font-size:12px;font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- catalog cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden;cursor:pointer;transition:border-color .14s,transform .14s,box-shadow .14s;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);content-visibility:auto;contain-intrinsic-size:0 280px}
  .card:hover{border-color:var(--line2);transform:translateY(-1.5px);box-shadow:0 8px 24px -8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
  .stage{height:158px;padding:12px 14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .mini{width:100%;padding:11px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .mini-type{display:flex;flex-direction:column;gap:2px;min-width:0}
  .mini-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
  .mini-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .mini-row{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
  .strip{display:flex;height:4px;border-top:1px solid rgba(0,0,0,.08);border-bottom:1px solid rgba(0,0,0,.08)}
  .strip i{flex:1}
  .card-body{padding:13px 15px 14px;display:flex;flex-direction:column;flex:1}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .card-top h2{font-size:14px;font-weight:560;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  .vtag{margin-left:auto;display:inline-flex;align-items:center;gap:4.5px;font-size:10px;font-family:var(--mono);letter-spacing:.02em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);flex:none}
  .vtag::before{content:'';width:4.5px;height:4.5px;border-radius:50%;background:currentColor}
  .vtag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 28%,transparent);background:color-mix(in srgb,var(--ok) 6%,transparent)}
  .vtag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 28%,transparent);background:color-mix(in srgb,var(--warn) 6%,transparent)}
  .card-desc{font-size:12px;color:var(--dim);line-height:1.48;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
  .card-foot{margin-top:auto;padding-top:9px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;font-size:11px;color:var(--dim2);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .card-foot b{color:var(--dim);font-weight:500}
  .card-meta-right{display:inline-flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
  .star-pill{display:inline-flex;align-items:center;gap:3.5px;color:var(--ink);font-weight:500}
  .star-pill svg{width:11px;height:11px;color:var(--warn)}
  .repo-link{display:inline-flex;align-items:center;gap:3px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;transition:color .12s}
  .repo-link:hover{color:var(--ink)}
  .repo-link svg{width:10px;height:10px;flex:none;opacity:.7}

  /* ---------- pagination ---------- */
  .pager{display:flex;justify-content:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
  .pager-pages{display:inline-flex;align-items:center;gap:4px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 3%,transparent);border:1px solid var(--line)}
  .pager-btn{min-width:30px;height:28px;padding:0 9px;border-radius:999px;color:var(--dim);font-size:11.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:.12s}
  .pager-btn svg{width:12px;height:12px}
  .pager-btn:hover:not(:disabled){color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
  .pager-btn[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:600}
  .pager-btn:disabled{opacity:.32;cursor:default}
  .pager-dots{color:var(--dim2);font-size:11px;padding:0 4px}

  /* ---------- ranking leaderboard ---------- */
  .cov-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
  .cov-sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 15px;font-size:11.5px;color:var(--dim2)}
  .cov-sum b{display:block;font-size:20px;font-weight:600;color:var(--ink);font-family:var(--display);letter-spacing:-.025em;margin-bottom:2px;font-variant-numeric:tabular-nums}
  .rk-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .rk-table{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .rk-head{display:grid;grid-template-columns:54px minmax(220px,1.6fr) 160px 120px 130px minmax(140px,1fr);gap:14px;padding:9px 16px;font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--dim2);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--ink) 2%,transparent)}
  .rk-row{display:grid;grid-template-columns:54px minmax(220px,1.6fr) 160px 120px 130px minmax(140px,1fr);gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .12s;content-visibility:auto;contain-intrinsic-size:0 54px}
  .rk-row:last-child{border-bottom:0}
  .rk-row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
  .rk-num{font-family:var(--mono);font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .rk-name{display:flex;align-items:center;gap:11px;min-width:0}
  .rk-swatch{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid rgba(255,255,255,.14);font-weight:650;font-size:11px}
  .rk-title{display:flex;flex-direction:column;gap:1.5px;min-width:0}
  .rk-title b{font-size:13.5px;font-weight:560;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk-repo{font-size:11px;font-family:var(--mono);color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk-repo a{display:inline-flex;align-items:center;gap:3px;transition:color .12s}
  .rk-repo a:hover{color:var(--ink)}
  .rk-repo svg{width:10px;height:10px;opacity:.7}
  .rk-org{display:inline-flex;align-items:center;padding:3.5px 9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .rk-stars{display:inline-flex;align-items:center;gap:5px;padding:3.5px 9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);font-size:11.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);width:fit-content}
  .rk-stars svg{width:11px;height:11px;color:var(--warn)}
  .rk-npm{font-family:var(--mono);font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .rk-fws{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .fw-ico{height:22px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);font-size:10.5px;font-family:var(--mono);color:var(--dim)}
  .fw-ico svg{width:11px;height:11px;flex:none}
  @media (max-width:960px){
    .rk-head{display:none}
    .rk-row{grid-template-columns:42px 1fr auto;gap:10px}
    .rk-org,.rk-npm{display:none}
  }

  /* ---------- coverage ---------- */
  .cov-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .cov-row{display:grid;grid-template-columns:190px 1fr 150px 64px;gap:14px;align-items:center;padding:9px 15px;border-bottom:1px solid var(--line);font-size:12.5px}
  .cov-row:last-child{border-bottom:0}
  .cov-row.have:hover{background:color-mix(in srgb,var(--ink) 4%,transparent);cursor:pointer}
  .cov-org{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cov-sys{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cov-src{color:var(--dim2);font-size:11px;font-family:var(--mono)}
  .cov-tag{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim2);text-align:center}
  .cov-tag.in{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
  .cov-tag.npm{color:var(--ink);border-color:var(--line2)}
  .cov-tag.repo{color:var(--dim);border-color:var(--line2)}
  .cov-h{font-size:11px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--dim2);margin:24px 0 9px}

  /* ---------- detail page (chameleon aware) ---------- */
  .detail{display:none}
  .detail.on{display:block}
  .detail-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .detail-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .detail-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .meta-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:11.5px;font-family:var(--mono);color:var(--dim)}
  .meta-pill svg{width:11px;height:11px}

  .hero-wrap{border-radius:var(--card-radius);overflow:hidden;border:1px solid var(--line);background:var(--panel)}
  .hero{padding:38px 40px;position:relative;overflow:hidden}
  .hero h1{margin:0 0 10px;letter-spacing:-.025em}
  .hero p{margin:0 0 22px;max-width:60ch;line-height:1.55}
  .hero-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .spec-bar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel)}
  .spec-cell{padding:13px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
  .spec-cell:last-child{border-right:0}
  .spec-cell small{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim2)}
  .spec-cell b{font-size:13px;font-weight:560;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spec-cell span{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spec-dots{display:flex;gap:5px;align-items:center;margin-top:2px}
  .spec-dots i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line2);display:inline-block}
  @media (max-width:780px){.spec-bar{grid-template-columns:1fr 1fr}.spec-cell:nth-child(2){border-right:0}.spec-cell:nth-child(1),.spec-cell:nth-child(2){border-bottom:1px solid var(--line)}}

  .sec{margin-top:34px}
  .sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:13px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .sec-h h2{font-size:11.5px;font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--dim)}
  .sec-h em{font-style:normal;font-size:11px;font-family:var(--mono);color:var(--dim2);margin-left:auto}

  .comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px}
  .comp{background:var(--panel);border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden;display:flex;flex-direction:column}
  .comp-stage{padding:20px 16px;display:flex;align-items:center;justify-content:center;min-height:82px;flex:1}
  .comp-info{padding:9px 12px 10px;border-top:1px solid var(--line);font-size:10.5px;font-family:var(--mono);color:var(--dim2);line-height:1.65;margin-top:auto}
  .comp-info b{display:block;color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:550;margin-bottom:3px}
  .comp-info span{color:var(--dim)}

  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
  .sw{border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden;cursor:pointer;background:var(--panel);transition:border-color .12s,transform .12s}
  .sw:hover{border-color:var(--line2);transform:translateY(-1px)}
  .sw i{display:block;height:44px}
  .sw div{padding:7px 9px;font-size:10.5px;font-family:var(--mono);line-height:1.45}
  .sw div b{display:block;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sw div span{color:var(--dim2)}

  .type-row{display:flex;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
  .type-row:last-child{border-bottom:0}
  .sheet{border-radius:var(--card-radius);border:1px solid var(--line);padding:4px 20px}
  .sheet .type-row{border-bottom-color:color-mix(in srgb,currentColor 12%,transparent)}
  .sheet .type-spec{color:inherit;opacity:.6}
  .type-spec{flex:none;width:160px;font-size:10.5px;font-family:var(--mono);color:var(--dim2);line-height:1.55}
  .type-spec b{display:block;color:var(--dim);font-weight:500}
  .sheet .type-spec b{color:inherit;opacity:.85}
  .type-demo{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

  .notes p{font-size:13px;line-height:1.7;color:var(--dim);margin:0 0 12px}
  .notes h4{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink);margin:16px 0 8px}
  .notes ul{margin:0 0 14px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.65;color:var(--dim)}
  .notes strong{color:var(--ink);font-weight:560}
  .notes code{font-family:var(--mono);font-size:11.5px;padding:1.5px 5px;border-radius:4px;background:color-mix(in srgb,var(--ink) 6%,transparent);border:1px solid var(--line);color:var(--ink)}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--card-radius);padding:10px 14px;font-family:var(--mono);font-size:12px;color:var(--ink)}
  .cmd code{flex:1;overflow-x:auto;white-space:nowrap}
  .cmd-stack{display:flex;flex-direction:column;gap:9px}
  .prompt-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--card-radius);padding:10px 14px}
  .prompt-box summary{cursor:pointer;font-size:11.5px;font-family:var(--mono);color:var(--dim);user-select:none}
  .prompt-box pre{margin:10px 0 0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--dim);max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  .kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

  if(!nums.length) return '5px 11px';

  const h=nums.length>=2?nums[1]:nums[0];
  const cv=Math.max(4,Math.min(8,Math.round(v*0.65)));
  const ch=Math.max(8,Math.min(14,Math.round(h*0.65)));
  return cv+'px '+ch+'px';
}
function thumbRadius(r, cap=12){
  if(!r) return '6px';
  const s=String(r).trim();
  const n=parseFloat(s);
  if(!Number.isFinite(n)) return '6px';
  const px=/rem|em$/.test(s)?n*16:n;
  if(px>=100) return '999px';
  return Math.max(0,Math.min(cap,Math.round(px*0.85)))+'px';
}
function btnStyle(p,c,small,backdrop){
  const t=bodyType(p);
  const fs=small?Math.min(Math.max(Math.round((pxOf(t)||14)*0.82),10),12):Math.min(Math.max(pxOf(t)||14,12),14.5);
  const rawBg=cleanColor(c.backgroundColor);
  const bg=rawBg||(c.border?'transparent':p.brand);
  const surf=backdrop||p.canvas;
  const plate=over(bg,surf);
  const a=parseColor(bg),b=parseColor(surf);
  const onCanvas=!a||!b||a[3]<0.12||Math.abs(lum(over(bg,surf))-lum(b))<0.07;
  const rawFg=cleanColor(c.textColor);
  const border=cleanColor(c.border)||(onCanvas?'1px solid '+p.border:'none');
  return [
    'background:'+safeCss(bg),
    'color:'+safeCss(readable(rawFg||ink(plate),plate)),
    'border:'+safeCss(border),
    'border-radius:'+safeCss(small?thumbRadius(c.rounded||p.radius,999):c.rounded||p.radius),
    'padding:'+safeCss(clampPad(c.padding,small)),
    'box-shadow:'+safeCss(cleanColor(c.shadow)||'none'),
    'font-family:'+fontStack(t.fontFamily),
    'font-size:'+fs+'px',
    'font-weight:'+safeCss(t.fontWeight||500),
    'line-height:1.2',
    'letter-spacing:'+safeCss(t.letterSpacing||'normal'),
    'white-space:nowrap','cursor:pointer','display:inline-flex','align-items:center','gap:5px','flex-shrink:0','max-width:100%','overflow:hidden','text-overflow:ellipsis'
  ].join(';');
}
const ALT_COPY=['Learn more','Cancel','Details','View plans','Get started','Try it free'];

function renderButton(p,c,small,used,backdrop){

function pick(p,kind){ return p.components.filter(c=>c.kind===kind); }

function stageFor(p){
  const d=displayType(p), t=bodyType(p);
  const canvasLum=lum(parseColor(p.canvas)||[255,255,255,1]);
  const cards=pick(p,'card');
  const cardTok=cards.find(c=>{const bg=cleanColor(c.backgroundColor);if(!bg)return false;const pl=over(bg,p.canvas);return (lum(pl)>=0.36)===(canvasLum>=0.36);})||cards[0];
  const cardBg=cleanColor(cardTok&&cardTok.backgroundColor)||p.surface||p.canvas;
  const cardPlate=over(cardBg,p.canvas);
  const sameSurf=!parseColor(cardBg)||Math.abs(lum(cardPlate)-lum(parseColor(p.canvas)||[0,0,0,1]))<0.025;
  const cardBorder=cleanColor(cardTok&&cardTok.border)||('1px solid '+p.border);
  const cardRad=thumbRadius((cardTok&&cardTok.rounded)||p.radius,12);
  const cardShadow=cleanColor(cardTok&&cardTok.shadow)||'none';
  const titleInk=readable(cleanColor(cardTok&&cardTok.textColor)||p.text,cardPlate);
  const mutedInk=readable(p.muted,cardPlate);
  const dSize=Math.round(Math.min(Math.max(pxOf(d)*0.48,13),16.5));
  const bSize=Math.round(Math.min(Math.max(pxOf(t)*0.72,10),11.5));

  const rawBtns=pick(p,'button').filter(b=>cleanColor(b.backgroundColor)||cleanColor(b.textColor)||cleanColor(b.border));
  const solidBtns=rawBtns.filter(b=>{const c=parseColor(cleanColor(b.backgroundColor));return c&&c[3]>0.2});
  const ghostBtns=rawBtns.filter(b=>{const c=parseColor(cleanColor(b.backgroundColor));return !c||c[3]<=0.2});
  const chosen=[];
  if(solidBtns.length) chosen.push(solidBtns[0]);
  if(ghostBtns.length) chosen.push(ghostBtns[0]);
  else if(solidBtns.length>1) chosen.push(solidBtns[1]);
  else if(!chosen.length&&rawBtns.length) chosen.push(rawBtns[0]);

  const badges=pick(p,'badge');
  const inputs=pick(p,'input');
  const used=new Set();
  const row=[];
  if(chosen.length){
    chosen.forEach(c=>row.push(renderButton(p,c,true,used,cardBg)));
  }else{
    row.push(renderButton(p,{key:'button-primary',backgroundColor:p.brand},true,used,cardBg));
    if(inputs.length) row.push(renderInput(p,inputs[0],true,cardBg));
  }
  row.push(renderBadge(p,badges[0],true,cardBg));

  const boxStyle=[
    'background:'+safeCss(cardBg),
    'border:'+safeCss(sameSurf&&!cardTok?'1px solid '+alpha(readable(p.text,cardPlate),0.14):cardBorder),
    'border-radius:'+safeCss(cardRad),
    'box-shadow:'+safeCss(cardShadow)
  ].join(';');

  return '<div class="mini" style="'+boxStyle+'">'+
    '<div class="mini-type">'+
      '<div class="mini-title" style="font-family:'+fontStack(d.fontFamily)+';font-size:'+dSize+'px;font-weight:'+(d.fontWeight||600)+';letter-spacing:'+safeCss(d.letterSpacing||'normal')+';color:'+safeCss(titleInk)+'">'+esc(p.name)+'</div>'+
      '<div class="mini-sub" style="font-family:'+fontStack(t.fontFamily)+';font-size:'+bSize+'px;font-weight:'+(t.fontWeight||400)+';color:'+safeCss(mutedInk)+'">'+(p.palette.length+' colors \u00b7 '+p.type.length+' type \u00b7 '+p.components.length+' comp')+'</div>'+
    '</div>'+
    '<div class="mini-row">'+row.join('')+'</div>'+
  '</div>';
}

function stripColors(p,max){
  const seen=new Set();
  const out=[];
  const push=v=>{ if(v&&!seen.has(v)&&out.length<max){ seen.add(v); out.push(v); } };
  [p.canvas,p.brand,p.text,p.surface,p.muted].forEach(push);
  const rest=p.palette.map(c=>c.value).filter(v=>!seen.has(v));
  const need=Math.max(0,max-out.length);
  if(need&&rest.length){
    const step=Math.max(1,Math.floor(rest.length/need));
    for(let i=0;i<rest.length&&out.length<max;i+=step) push(rest[i]);
    for(let i=0;i<rest.length&&out.length<max;i++) push(rest[i]);
  }
  return out;
}

function sentence(s,n){
  if(!s) return 'A specimen rendered from this system\u2019s own tokens.';
  const first=String(s).split('\n')[0].trim();
  if(first.length<=n) return first;
  const cut=first.slice(0,n);
  const m=cut.match(/^[\s\S]*[.!?](?=\s)/);
  const out=m?m[0]:cut.replace(/\s+\S*$/,'');
  return /[.!?\u2026]$/.test(out.trim())?out.trim():out.trim()+'\u2026';
}

/* ---------- on-demand font loader ---------- */
const GF_ALLOW=new Set([
  'Roboto','Roboto Flex','Roboto Mono','Open Sans','Lato','Ubuntu','Public Sans',
  'Source Sans 3','Source Code Pro','Red Hat Display','Red Hat Text','Red Hat Mono',
  'Overpass','Titillium Web','Nunito','Nunito Sans','DM Sans','Poppins','Work Sans',
  'Fira Sans','Fira Code','Space Grotesk','Space Mono','Manrope','Outfit','Figtree',
  'Merriweather','Lora','PT Serif','Playfair Display','Libre Baskerville','Chakra Petch',
  'Spline Sans Mono','Atkinson Hyperlegible','Anonymous Pro','Inconsolata','Noto Sans',
  'Rubik','Montserrat','Cabin','Barlow','Mulish','Karla','Hind','Lexend','Sora','Bitter'
]);
const GF_LOADED=new Set(['Inter','Geist','IBM Plex Sans','IBM Plex Mono','Source Serif 4','Plus Jakarta Sans','JetBrains Mono']);
function ensureFontsFor(items){
  const want=[];
  (items||[]).forEach(d=>(d&&d.type||[]).forEach(t=>{
    const st=fontStack(t.fontFamily);
    st.split(',').forEach(part=>{
      const clean=part.replace(/['"]/g,'').trim();
      if(GF_ALLOW.has(clean)&&!GF_LOADED.has(clean)){
        GF_LOADED.add(clean);
        want.push(clean);
      }
    });
  }));
  for(let i=0;i<want.length;i+=10){
    const batch=want.slice(i,i+10).map(n=>'family='+encodeURIComponent(n)+':wght@400;500;600;700').join('&');
    const link=document.createElement('link');
    link.rel='stylesheet';
    link.href='https://fonts.googleapis.com/css2?'+batch+'&display=swap';
    document.head.appendChild(link);
  }
}

const state={q:'',filter:'all',view:'systems',rkMode:'ds',page:1,pageSize:24,rkPage:1,rkPageSize:24};
const grid=document.getElementById('grid');
const pagerEl=document.getElementById('pager');
const detail=document.getElementById('detail');
const index=document.getElementById('index');
const listedChip=document.querySelector('.chip[data-f="listed"]');
if(listedChip && DATA.some(d=>d.provenance==='listed')) listedChip.style.display='';

function buildPagerHtml(total,page,pageSize){
  const effSize=pageSize||24;
  const totalPages=Math.max(1,Math.ceil(total/effSize));
  if(totalPages<=1) return '';
  const curPage=Math.min(Math.max(1,page),totalPages);
  const pages=[];
  const pushPage=p=>pages.push('<button type="button" class="pager-btn" data-pg="'+p+'"'+(p===curPage?' aria-current="page"':'')+'>'+p+'</button>');
  if(totalPages<=9){
    for(let p=1;p<=totalPages;p++) pushPage(p);
  }else{
    pushPage(1);
    if(curPage>3) pages.push('<span class="pager-dots">\u2026</span>');
    const pStart=Math.max(2,curPage-1);
    const pEnd=Math.min(totalPages-1,curPage+1);
    for(let p=pStart;p<=pEnd;p++) pushPage(p);
    if(curPage<totalPages-2) pages.push('<span class="pager-dots">\u2026</span>');
    pushPage(totalPages);
  }
  return '<div class="pager">'+
    '<div class="pager-pages">'+
      '<button type="button" class="pager-btn" data-pg="'+(curPage-1)+'"'+(curPage<=1?' disabled':'')+'>'+ICONS.back+'Prev</button>'+
      pages.join('')+
      '<button type="button" class="pager-btn" data-pg="'+(curPage+1)+'"'+(curPage>=totalPages?' disabled':'')+'>Next'+ICONS.next+'</button>'+
    '</div>'+
  '</div>';
}

function bindPager(container,isRanking){
  if(!container) return;
  container.querySelectorAll('[data-pg]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=Number(btn.dataset.pg);
      if(!Number.isFinite(p)||p<1) return;
      window.scrollTo({top:0,behavior:'smooth'});
      if(isRanking){
        state.rkPage=p;
        transitionRanking();
      }else{
        state.page=p;
        transitionIndex();
      }
    });
  });
}

function fmtNum(n){
  const v=Number(n||0);
  if(!v) return '\u2014';
  if(v>=1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(v>=1e3) return (v/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  return String(v);
}
function shortRepo(u){
  if(!u) return '';
  const m=/(?:github\.com|bitbucket\.org)\/([^/]+\/[^/#?]+)/i.exec(u);
  return m?m[1]:u.replace(/^https?:\/\/(www\.)?/,'');
}

function matches(d){
  if(state.filter==='popular' && !d.stars && !d.npmDownloads && !d.repo) return false;
  if(state.filter==='verified' && !d.verified) return false;
  if(state.filter==='listed' && d.provenance!=='listed') return false;
  if(state.filter!=='listed' && d.provenance==='listed' && state.filter!=='all') return false;
  if(state.filter==='dark' && d.theme!=='dark') return false;
  if(state.filter==='light' && d.theme!=='light') return false;
  if(!state.q) return true;
  const q=state.q.toLowerCase();
  return (d.name+' '+d.org+' '+d.style+' '+(d.repo||'')+' '+(d.package||'')+' '+(d.tags||[]).join(' ')+' '+(d.listedNames||[]).join(' ')+' '+d.category).toLowerCase().includes(q);
}

function card(d){
  if(d.provenance==='listed'){
    return '<article class="card listed" data-slug="'+esc(d.slug)+'">'+
      '<div class="stage" style="background:var(--panel2);display:flex;align-items:center;justify-content:center">'+

      '<div class="card-body"><div class="card-top"><h2>'+esc(d.name)+'</h2>'+
        '<span class="vtag warn">listed</span></div>'+

  }
  const strip=stripColors(d,10);

  if(d.repo) rightMeta.push('<a class="repo-link" href="'+esc(d.repo)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(shortRepo(d.repo))+ICONS.ext+'</a>');

      '<span class="vtag '+(d.verified?'ok':'warn')+'">'+(d.verified?'Verified':d.warnings+' warn')+'</span></div>'+
      '<p class="card-desc">'+esc(d.style)+'</p>'+
      '<div class="card-foot">'+
        '<span><b>'+d.components.length+'</b> comp \u00b7 <b>'+d.palette.length+'</b> col \u00b7 <b>'+d.type.length+'</b> type</span>'+
        (rightMeta.length?'<span class="card-meta-right">'+rightMeta.join('')+'</span>':'')+
      '</div>'+
    '</div></article>';
}

function renderIndex(){
  const list=DATA.filter(matches).slice();
  if(state.filter==='popular'){
    list.sort((a,b)=>(a.popularityRank||999)-(b.popularityRank||999));
  }
  const total=list.length;
  const effSize=state.pageSize||24;
  const totalPages=Math.max(1,Math.ceil(total/effSize));
  if(state.page>totalPages) state.page=1;
  const startIdx=(state.page-1)*effSize;
  const endIdx=Math.min(total,startIdx+effSize);
  const visible=list.slice(startIdx,endIdx);
  ensureFontsFor(visible);
  grid.innerHTML=visible.map(card).join('');
  pagerEl.innerHTML=buildPagerHtml(total,state.page,state.pageSize);
  bindPager(pagerEl,false);
  document.getElementById('count').textContent=total?(startIdx+1)+'\u2013'+endIdx+' of '+total:'0 of '+DATA.length;
  document.getElementById('empty').style.display=total?'none':'block';
  grid.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click',()=>{location.hash='#/'+el.dataset.slug});
  });
}

    colors: Object.fromEntries((d.palette||[]).map(c=>[c.name,c.value])),
    typography: Object.fromEntries((d.type||[]).map(t=>[t.name,{
      fontFamily: t.fontFamily,
      fontSize: t.fontSize,
      fontWeight: t.fontWeight,
      lineHeight: t.lineHeight,
      letterSpacing: t.letterSpacing
    }])),
    components: Object.fromEntries((d.components||[]).map(c=>[c.key,c])),
    overview: d.overview || "",
    dos: d.dos || ""
  };
}
function agentPromptFor(d){
  const lines=[
    'Build UI following the **'+d.name+'** design system (`'+d.slug+'`) using ONLY the verified tokens below.',
    '',
    '## Identity & Surfaces',
    '- Theme: '+d.theme+' ('+d.provenance+', '+d.license+' license)',
    '- Canvas: `'+d.canvas+'` \u00b7 Surface: `'+d.surface+'` \u00b7 Text: `'+d.text+'` \u00b7 Muted: `'+d.muted+'` \u00b7 Brand: `'+d.brand+'` \u00b7 Border: `'+d.border+'` \u00b7 Radius: `'+d.radius+'`',
    '',
    '## Colors ('+(d.palette||[]).length+')',
    ...(d.palette||[]).map(c=>'- `'+c.name+'`: `'+c.value+'`')
  ];
  if((d.type||[]).length){
    lines.push('','## Typography ('+d.type.length+')');
    d.type.forEach(t=>{
      const spec=[t.fontFamily&&'font: '+t.fontFamily,t.fontSize&&'size: '+t.fontSize,t.fontWeight&&'weight: '+t.fontWeight,t.lineHeight&&'line-height: '+t.lineHeight,t.letterSpacing&&'tracking: '+t.letterSpacing].filter(Boolean).join(' \u00b7 ');
      lines.push('- `'+t.name+'`: '+spec);
    });
  }
  if((d.components||[]).length){
    lines.push('','## Components ('+d.components.length+')');
    d.components.forEach(c=>{
      const spec=[c.backgroundColor&&'bg='+c.backgroundColor,c.textColor&&'text='+c.textColor,c.border&&c.border!=='none'&&'border='+c.border,c.rounded&&'radius='+c.rounded,c.padding&&'padding='+c.padding,c.shadow&&'shadow='+c.shadow].filter(Boolean).join(', ');
      lines.push('- `'+c.key+'`: '+(spec||'inherits palette'));
    });
  }
  if(d.overview||d.dos){
    lines.push('','## Guidelines');
    if(d.overview) lines.push(d.overview);
    if(d.dos) lines.push(d.dos);
  }
  lines.push('','## Implementation Rules','- Use these exact colors, typography steps, and component styles without inventing off-system tokens.','- Maintain >= 4.5:1 contrast for body and button labels on their resolved backgrounds.');
  return lines.join('\n');
}

/* ---------- theme chameleon ---------- */
const THEME_VARS=['--bg','--panel','--panel2','--line','--line2','--ink','--dim','--dim2','--accent','--accent-fg','--sans','--display','--card-radius','--header-bg'];
function applySystemTheme(d){
  if(!d||d.provenance==='listed'){ resetSystemTheme(); return; }
  const rootEl=document.documentElement;
  rootEl.classList.add('sys-active');
  const cRgb=parseColor(d.canvas)||[255,255,255,1];
  const isDark=lum(cRgb)<0.36;
  const inkCol=readable(d.text,d.canvas);
  const dimCol=readable(d.muted,d.canvas);
  const panelCol=(d.surface&&d.surface!==d.canvas)?d.surface:(isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.03)');
  const panel2Col=isDark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)';
  const lineCol=d.border||(isDark?'rgba(255,255,255,0.12)':'rgba(0,0,0,0.1)');
  const line2Col=isDark?'rgba(255,255,255,0.22)':'rgba(0,0,0,0.2)';
  const cardRad=parseFloat(d.radius)>=20?'14px':(d.radius||'10px');
  const bFam=fontStack(bodyType(d).fontFamily);
  const dFam=fontStack(displayType(d).fontFamily);
  rootEl.style.setProperty('--bg',d.canvas);
  rootEl.style.setProperty('--panel',panelCol);
  rootEl.style.setProperty('--panel2',panel2Col);
  rootEl.style.setProperty('--line',lineCol);
  rootEl.style.setProperty('--line2',line2Col);
  rootEl.style.setProperty('--ink',inkCol);
  rootEl.style.setProperty('--dim',dimCol);
  rootEl.style.setProperty('--dim2',alpha(inkCol,0.55));
  rootEl.style.setProperty('--accent',d.brand);
  rootEl.style.setProperty('--accent-fg',readable(ink(d.brand),d.brand));
  rootEl.style.setProperty('--sans',bFam);
  rootEl.style.setProperty('--display',dFam);
  rootEl.style.setProperty('--card-radius',cardRad);
  rootEl.style.setProperty('--header-bg',alpha(d.canvas,0.86));
}
function resetSystemTheme(){
  const rootEl=document.documentElement;
  rootEl.classList.remove('sys-active');
  THEME_VARS.forEach(v=>rootEl.style.removeProperty(v));
}

/* ---------- detail ---------- */
function detailHtml(d){
  const hasComps=d.components.length>0;
  const kinds={};
  d.components.forEach(c=>{kinds[c.kind]=(kinds[c.kind]||0)+1});
  const kindChips=Object.entries(kinds).map(([k,n])=>'<span class="kind"><b>'+n+'</b> '+k+'</span>').join('');

  const propList=c=>[c.backgroundColor&&'bg '+esc(c.backgroundColor),c.textColor&&'fg '+esc(c.textColor),
      c.rounded&&'r '+esc(c.rounded),c.padding&&'pad '+esc(c.padding),c.border&&c.border!=='none'&&'border',c.shadow&&'shadow']
      .filter(Boolean).join('<br>')||'inherits palette';

  function renderFor(c){
    if(c.kind==='input') return renderInput(d,c);
    if(c.kind==='badge') return renderBadge(d,c);
    if(c.kind==='button') return renderButton(d,c,false);
    return renderSurface(d,c);
  }

  const items=hasComps
    ? d.components.map(c=>({demo:renderFor(c),bg:stageBg(d,c),name:labelOf(c.key),sub:c.key,props:propList(c)}))
    : [
        {demo:renderButton(d,{key:'button-primary',backgroundColor:d.brand},false),bg:d.canvas,name:'Button',sub:'derived',props:'brand fill + body type'},
        {demo:renderInput(d),bg:d.canvas,name:'Input',sub:'derived',props:'surface + border + radius'},
        {demo:renderBadge(d),bg:d.canvas,name:'Badge',sub:'derived',props:'text tint + radius'},
        {demo:renderCardBox(d),bg:d.canvas,name:'Card',sub:'derived',props:'surface + border + radius'}
      ];

  const comps=items.map(it=>
    '<div class="comp"><div class="comp-stage" style="background:'+safeCss(it.bg)+'">'+it.demo+'</div>'+
    '<div class="comp-info"><b>'+esc(it.name)+'</b><span>'+esc(it.sub)+'</span><br>'+it.props+'</div></div>'
  ).join('');

  const swatches=d.palette.map(c=>
    '<div class="sw" data-copy="'+esc(c.value)+'"><i style="background:'+safeCss(c.value)+'"></i>'+
    '<div><b>'+esc(c.name)+'</b><span>'+esc(c.value)+'</span></div></div>').join('');

  const types=d.type.map(t=>{
    const size=Math.min(pxOf(t),34);
    return '<div class="type-row"><div class="type-spec"><b>'+esc(t.name)+'</b>'+
      (t.fontSize?pxOf(t)+'px ':'')+esc(t.fontWeight||'')+(t.lineHeight?' / '+esc(t.lineHeight):'')+'</div>'+
      '<div class="type-demo" style="font-family:'+fontStack(t.fontFamily)+';font-size:'+size+'px;font-weight:'+
      safeCss(t.fontWeight||400)+';letter-spacing:'+safeCss(t.letterSpacing||'normal')+';line-height:1.2">The quick brown fox jumps over the lazy dog</div></div>';
  }).join('');

  function inlineMd(s){
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/`([^`]+)`/g,'<code>$1</code>');
  }
  function renderMd(raw){
    if(!raw) return '';
    const lines=String(raw).split(/\r?\n/);
    const out=[];
    let inList=false;
    for(const ln of lines){
      const t=ln.trim();
      if(!t){ if(inList){ out.push('</ul>'); inList=false; } continue; }
      if(/^#{2,4}\s+/.test(t)){
        if(inList){ out.push('</ul>'); inList=false; }
        out.push('<h4>'+inlineMd(t.replace(/^#{2,4}\s+/,''))+'</h4>');
      }else if(/^[-*]\s+/.test(t)){
        if(!inList){ out.push('<ul>'); inList=true; }
        out.push('<li>'+inlineMd(t.replace(/^[-*]\s+/,''))+'</li>');
      }else{
        if(inList){ out.push('</ul>'); inList=false; }
        out.push('<p>'+inlineMd(t)+'</p>');
      }
    }
    if(inList) out.push('</ul>');
    return out.join('');
  }
  const notes=[renderMd(d.overview),renderMd(d.dos)].filter(Boolean).join('');
  const backLabel=state.view==='ranking'?'Ranking':state.view==='coverage'?'Coverage':'Catalog';

  return '<div class="detail-bar">'+
      '<div class="detail-nav">'+
        '<a class="pill-btn" href="#">'+ICONS.back+backLabel+'</a>'+
        '<span style="font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.02em;margin-left:4px">'+esc(d.name)+'</span>'+
        (d.org?'<span class="meta-pill">'+esc(d.org)+'</span>':'')+
        '<span class="meta-pill">'+esc(d.license)+'</span>'+
        (d.stars?'<span class="meta-pill">'+ICONS.star+fmtNum(d.stars)+'</span>':'')+
        (d.npmDownloads?'<span class="meta-pill">'+ICONS.pkg+fmtNum(d.npmDownloads)+'/mo</span>':'')+
      '</div>'+
      '<div class="detail-actions">'+
        (d.repo?'<a href="'+esc(d.repo)+'" target="_blank" rel="noopener" class="pill-btn">'+ICONS.gh+esc(shortRepo(d.repo))+ICONS.ext+'</a>':'')+
        '<button type="button" class="pill-btn primary" data-copy-prompt>'+ICONS.copy+'Copy Prompt</button>'+
        '<button type="button" class="pill-btn" data-copy-json>'+ICONS.copy+'JSON</button>'+
      '</div>'+
    '</div>'+
    heroFor(d)+
    '<div class="sec"><div class="sec-h"><h2>Component Tokens</h2><em>'+d.components.length+' tokens across '+Object.keys(kinds).length+' canonical kinds</em></div>'+
      '<div class="kinds">'+kindChips+'</div>'+
      '<div class="comp-grid">'+comps+'</div></div>'+
    '<div class="sec"><div class="sec-h"><h2>Colour Palette</h2><em>'+d.palette.length+' tokens \u00b7 click any swatch to copy</em></div>'+
      '<div class="swatches">'+swatches+'</div></div>'+
    (d.type.length
      ? '<div class="sec"><div class="sec-h"><h2>Typography Scale</h2><em>'+d.type.length+' steps</em></div>'+
        '<div class="sheet" style="background:'+safeCss(d.canvas)+';color:'+safeCss(readable(d.text,d.canvas))+'">'+types+'</div></div>'
      : '')+
    (notes?'<div class="sec notes"><div class="sec-h"><h2>Visual Language &amp; Guidelines</h2><em>architecture &amp; usage</em></div>'+notes+'</div>':'')+
    '<div class="sec"><div class="sec-h"><h2>CLI &amp; Agent Prompt</h2><em>install or copy full specification</em></div>'+
      '<div class="cmd-stack">'+
        '<div class="cmd"><code>node bin/sourcebook.mjs add '+esc(d.slug)+' --framework prompt</code>'+
        '<button class="pill-btn" data-copy="node bin/sourcebook.mjs add '+esc(d.slug)+' --framework prompt">'+ICONS.copy+'Copy CLI</button></div>'+
        '<details class="prompt-box"><summary>Inspect full agent prompt ('+d.palette.length+' colors \u00b7 '+d.type.length+' type \u00b7 '+d.components.length+' components)</summary>'+
          '<pre>'+esc(agentPromptFor(d))+'</pre>'+
        '</details>'+
      '</div></div>';
}

/* ---------- skeletons & loader ---------- */
let loaderT, detailRenderT, viewRenderT;
function startLoader(){
  const el=document.getElementById('topLoader');
  if(el) el.classList.add('on');
  clearTimeout(loaderT);
}
function stopLoader(){
  clearTimeout(loaderT);
  loaderT=setTimeout(()=>{
    const el=document.getElementById('topLoader');
    if(el) el.classList.remove('on');
  },80);
}
function detailSkeletonHtml(d){
  return '<div class="skel-status"><span class="spin"></span>Applying <b>'+esc(d.name)+'</b> visual language\u2026</div>'+
    '<div class="skel-box skel-hero"></div>'+
    '<div class="comp-grid">'+Array.from({length:4},()=>'<div class="skel-box" style="height:140px"></div>').join('')+'</div>';
}
function gridSkeletonHtml(){
  return Array.from({length:6},()=>'<div class="skel-box skel-card"></div>').join('');
}
function rankingSkeletonHtml(){
  return '<div class="skel-status"><span class="spin"></span>Loading leaderboard\u2026</div>'+
    Array.from({length:8},()=>'<div class="skel-box skel-row"></div>').join('');
}
function transitionIndex(){
  clearTimeout(viewRenderT);
  startLoader();
  grid.innerHTML=gridSkeletonHtml();
  viewRenderT=setTimeout(()=>{
    renderIndex();
    grid.classList.remove('fade-in');
    void grid.offsetWidth;
    grid.classList.add('fade-in');
    stopLoader();
  },55);
}
function transitionRanking(){
  clearTimeout(viewRenderT);
  startLoader();
  rankingEl.innerHTML=rankingSkeletonHtml();
  viewRenderT=setTimeout(()=>{
    renderRanking();
    rankingEl.classList.remove('fade-in');
    void rankingEl.offsetWidth;
    rankingEl.classList.add('fade-in');
    stopLoader();
  },55);
}

function renderDetail(slug){
  const d=DATA.find(x=>x.slug===slug);
  if(!d){ location.hash=''; return; }
  clearTimeout(detailRenderT);
  clearTimeout(viewRenderT);
  startLoader();
  ensureFontsFor([d]);
  applySystemTheme(d);
  index.style.display='none';
  rankingEl.style.display='none';
  coverageEl.style.display='none';
  detail.classList.add('on');
  detail.innerHTML=detailSkeletonHtml(d);
  window.scrollTo(0,0);
  detailRenderT=setTimeout(()=>{
    detail.innerHTML='<div class="fade-in">'+detailHtml(d)+'</div>';
    detail.querySelectorAll('[data-copy]').forEach(el=>{
      el.addEventListener('click',()=>copy(el.dataset.copy));
    });
    detail.querySelectorAll('[data-pg-btn]').forEach(el=>{
      el.addEventListener('click',()=>toast('Triggered '+el.dataset.pgBtn));
    });
    const cpPrompt=detail.querySelector('[data-copy-prompt]');
    if(cpPrompt) cpPrompt.addEventListener('click',()=>copy(agentPromptFor(d)));
    const cpJson=detail.querySelector('[data-copy-json]');
    if(cpJson) cpJson.addEventListener('click',()=>copy(JSON.stringify(agentJsonFor(d),null,2)));
    stopLoader();
  },75);
}

function copy(text){
  navigator.clipboard.writeText(text).then(()=>toast('Copied '+text.slice(0,28)),()=>toast('Copy failed'));
}
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=ICONS.check+'<span>'+esc(msg)+'</span>';
  t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1400);
}

/* ---------- ranking ---------- */
const rankingEl=document.getElementById('ranking');

function renderRanking(){
  const q=state.q.toLowerCase();
  const mode=state.rkMode||'ds';
  let list=DATA.filter(d=>{
    if(q && !(d.name+' '+d.org+' '+(d.repo||'')+' '+(d.package||'')+' '+d.style).toLowerCase().includes(q)) return false;
    if(mode==='enterprise') return Boolean(d.enterpriseRank);
    if(mode==='ds') return Boolean(d.isDesignSystemRepo);
    if(mode==='npm') return d.npmDownloads>0;
    return Boolean(d.repo || d.package || d.stars);
  }).slice();

  if(mode==='enterprise') list.sort((a,b)=>(a.enterpriseRank||999)-(b.enterpriseRank||999));
  else if(mode==='npm') list.sort((a,b)=>(b.npmDownloads||0)-(a.npmDownloads||0));
  else list.sort((a,b)=>(b.stars||0)-(a.stars||0)||(b.npmDownloads||0)-(a.npmDownloads||0));

  const total=list.length;
  const effSize=state.rkPageSize||24;
  const totalPages=Math.max(1,Math.ceil(total/effSize));
  if(state.rkPage>totalPages) state.rkPage=1;
  const startIdx=(state.rkPage-1)*effSize;
  const endIdx=Math.min(total,startIdx+effSize);
  const visible=list.slice(startIdx,endIdx);
  ensureFontsFor(visible);

  const rows=visible.map((d,idx)=>{
    const i=startIdx+idx;
    const org=d.org || (d.name.includes(' ') ? d.name.split(' ')[0] : d.slug);
    const repoLink=d.repo
      ? '<a href="'+esc(d.repo)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(shortRepo(d.repo))+ICONS.ext+'</a>'
      : (d.package ? '<span>npm: '+esc(d.package)+'</span>' : '<span>\u2014</span>');
    const init=(d.name||d.slug).slice(0,1).toUpperCase();
    const swFg=ink(d.brand||'#6366f1');
    return '<div class="rk-row" data-slug="'+esc(d.slug)+'">'+
      '<div class="rk-num">#'+(i+1)+'</div>'+
      '<div class="rk-name">'+
        '<span class="rk-swatch" style="background:'+safeCss(d.brand)+';color:'+safeCss(swFg)+'">'+esc(init)+'</span>'+
        '<div class="rk-title"><b style="font-family:'+fontStack(displayType(d).fontFamily)+'">'+esc(d.name)+'</b>'+
        '<span class="rk-repo">'+repoLink+'</span></div>'+
      '</div>'+
      '<div><span class="rk-org">'+esc(org)+'</span></div>'+
      '<div><span class="rk-stars">'+ICONS.star+fmtNum(d.stars)+'</span></div>'+
      '<div class="rk-npm">'+(d.npmDownloads?fmtNum(d.npmDownloads)+'/mo':'\u2014')+'</div>'+
      '<div class="rk-fws">'+renderFwIcons(d.frameworks)+'</div>'+
    '</div>';
  }).join('');

  const withRepos=DATA.filter(d=>d.repo).length;
  const totalStars=DATA.reduce((a,d)=>a+(d.stars||0),0);
  const totalNpm=DATA.reduce((a,d)=>a+(d.npmDownloads||0),0);

  rankingEl.innerHTML=
    '<div class="meta"><h1>Popularity Leaderboard</h1><em>'+(startIdx+1)+'\u2013'+endIdx+' of '+total+' systems</em></div>'+
    '<div class="cov-sum">'+
      '<div><b>'+withRepos+'</b>linked repositories</div>'+
      '<div><b>'+fmtNum(totalStars)+'</b>GitHub stars</div>'+
      '<div><b>'+fmtNum(totalNpm)+'</b>monthly npm downloads</div>'+
      '<div><b>'+total+'</b>ranked in view</div>'+
    '</div>'+
    '<div class="rk-controls">'+
      '<div class="seg">'+
        '<button class="chip" data-rk="ds" aria-pressed="'+String(mode==='ds')+'">Design System Repos</button>'+
        '<button class="chip" data-rk="enterprise" aria-pressed="'+String(mode==='enterprise')+'">Featured Enterprise</button>'+
        '<button class="chip" data-rk="npm" aria-pressed="'+String(mode==='npm')+'">Most Downloaded (npm)</button>'+
        '<button class="chip" data-rk="all" aria-pressed="'+String(mode==='all')+'">All Linked ('+withRepos+')</button>'+
      '</div>'+
    '</div>'+
    '<div class="rk-table">'+
      '<div class="rk-head"><span>#</span><span>System &amp; Repository</span><span>Organization</span><span>Stars</span><span>npm / mo</span><span>Frameworks</span></div>'+
      rows+
    '</div>'+
    '<div id="rkPager">'+buildPagerHtml(total,state.rkPage,state.rkPageSize)+'</div>';

  bindPager(document.getElementById('rkPager'),true);
  rankingEl.querySelectorAll('[data-rk]').forEach(btn=>{
    btn.addEventListener('click',()=>{ state.rkMode=btn.dataset.rk; state.rkPage=1; transitionRanking(); });
  });
  rankingEl.querySelectorAll('.rk-row[data-slug]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('a')) return;
      const slug=el.dataset.slug;
      if(location.hash==='#/'+slug) renderDetail(slug);
      else location.hash='#/'+slug;
    });
  });
}

/* ---------- coverage ---------- */
const coverageEl=document.getElementById('coverage');

function renderCoverage(){
  const entries=(COVERAGE.union&&COVERAGE.union.entries)||[];
  const q=state.q.toLowerCase();
  const list=entries.filter(e=>!q||(e.org+' '+e.systems.map(s=>s.name).join(' ')).toLowerCase().includes(q));
  const have=list.filter(e=>e.covered);
  const miss=list.filter(e=>!e.covered);

  const row=e=>{
    const names=[...new Set(e.systems.map(s=>s.name))].join(' \u00b7 ');
    const srcs=[...new Set(e.systems.map(s=>s.sourceId||s.source))].join(', ');
    const tag=e.covered
      ?'<span class="cov-tag in">sourced</span>'
      :(e.npm?'<span class="cov-tag npm">npm</span>'
      :(e.repo?'<span class="cov-tag repo">repo</span>':'<span class="cov-tag">docs</span>'));
    return '<div class="cov-row'+(e.covered?' have':'')+'"'+(e.covered?' data-slug="'+esc(e.covered)+'"':'')+'>'+
      '<span class="cov-org">'+esc(e.org)+'</span>'+
      '<span class="cov-sys">'+esc(names)+'</span>'+
      '<span class="cov-src">'+esc(srcs)+'</span>'+tag+'</div>';
  };

  const total=entries.length;
  const haveAll=entries.filter(e=>e.covered).length;
  const reachAll=entries.filter(e=>!e.covered&&e.npm).length;
  const repoAll=entries.filter(e=>!e.covered&&!e.npm&&e.repo).length;
  const srcLine=(COVERAGE.sources||[]).map(s=>s.name.split(' (')[0]+' '+s.covered+'/'+s.total).join('  \u00b7  ');

  coverageEl.innerHTML=
    '<div class="meta"><h1>Registry Coverage</h1><em>'+srcLine+'</em></div>'+
    '<div class="cov-sum">'+
      '<div><b>'+haveAll+'/'+total+'</b>organisations sourced</div>'+
      '<div><b>'+(total-haveAll)+'</b>unindexed</div>'+
      '<div><b>'+reachAll+'</b>reachable via npm</div>'+
      '<div><b>'+repoAll+'</b>reachable via repo</div>'+
    '</div>'+
    (have.length?'<div class="cov-h">In Registry \u2014 '+have.length+'</div><div class="cov-list">'+have.map(row).join('')+'</div>':'')+
    (miss.length?'<div class="cov-h">Unindexed \u2014 '+miss.length+'</div><div class="cov-list">'+miss.map(row).join('')+'</div>':'');

  coverageEl.querySelectorAll('[data-slug]').forEach(el=>{
    el.addEventListener('click',()=>{location.hash='#/'+el.dataset.slug});
  });
}

/* ---------- wiring ---------- */
let initialLoad=true;
function showView(){
  clearTimeout(detailRenderT);
  const wasSysActive=document.documentElement.classList.contains('sys-active');
  resetSystemTheme();

  rankingEl.style.display=rk?'':'none';

  detail.classList.remove('on');
  document.getElementById('catBtn').setAttribute('aria-pressed',String(sys));
  document.getElementById('rankBtn').setAttribute('aria-pressed',String(rk));
  document.getElementById('viewBtn').setAttribute('aria-pressed',String(cov));
  if(initialLoad){
    initialLoad=false;
    if(cov) renderCoverage();
    else if(rk) renderRanking();
    else renderIndex();
    return;
  }
  if(cov){
    startLoader();
    renderCoverage();
    stopLoader();
  }else if(rk){
    if(wasSysActive) transitionRanking();
    else { startLoader(); renderRanking(); stopLoader(); }
  }else{
    if(wasSysActive) transitionIndex();
    else { startLoader(); renderIndex(); stopLoader(); }
  }
}

document.getElementById('brandHome').addEventListener('click',()=>{
  state.view='systems';
  location.hash='';
  showView();
});
document.getElementById('catBtn').addEventListener('click',()=>{
  state.view='systems';
  location.hash='';
  showView();
});
document.getElementById('rankBtn').addEventListener('click',()=>{
  state.view='ranking';
  location.hash='';
  showView();
});
document.getElementById('viewBtn').addEventListener('click',()=>{
  state.view='coverage';
  location.hash='';
  showView();
});
document.getElementById('q').addEventListener('input',e=>{
  state.q=e.target.value; state.page=1; state.rkPage=1; location.hash=''; showView();
});
window.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement!==document.getElementById('q') && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){
    e.preventDefault();
    document.getElementById('q').focus();
  }else if(e.key==='Escape' && document.activeElement===document.getElementById('q')){
    document.getElementById('q').blur();
  }
});
document.getElementById('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b||!b.dataset.f) return;
  state.filter=b.dataset.f;
  state.page=1;
  document.querySelectorAll('.chip[data-f]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));
  state.view='systems';
  location.hash='';
  showView();
});
function route(){
  const slug=location.hash.replace(/^#\/?/,'');
  if(slug){ renderDetail(slug); return; }
  showView();
}
window.addEventListener('hashchange',route);
route();
</script>
