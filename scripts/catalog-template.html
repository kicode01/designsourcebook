function isLightOnlySvg(svgText,colors){
  const list=(colors&&colors.length?colors:[]);
  if(list.length && list.every(c=>/^#?(?:fff|ffffff|fafafa|f4f4f5|f8f8f8|e4e4e7)$/i.test(String(c).trim()))) return true;
  const fills=[...String(svgText||'').matchAll(/(?:fill|stroke)=["']([^"']+)["']/gi)].map(m=>m[1].trim()).filter(v=>!/^(?:none|transparent)$/i.test(v));
  return fills.length>0 && fills.every(c=>/^#?(?:fff|ffffff|fafafa|f4f4f5)$/i.test(c));
}

function scopeSvgIds(svgText,prefix){
  let out=String(svgText||'');
  const ids=[];
  out.replace(/\bid=["']([^"']+)["']/gi,(_,id)=>{ ids.push(id); return _; });
  if(ids.length){
    ids.forEach(id=>{
      const scoped=prefix+'_'+id;
      const escId=id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      out=out
        .replace(new RegExp('id=["\']'+escId+'["\']','g'),'id="'+scoped+'"')
        .replace(new RegExp('url\\(#'+escId+'\\)','g'),'url(#'+scoped+')')
        .replace(new RegExp('(xlink:href|href)=["\']#'+escId+'["\']','g'),'$1="#'+scoped+'"');
    });
  }
  return out;
}

function ensureSvgBox(svgText,fillMode,fixedSize){
  let out=String(svgText||'').trim();
  if(!/^<svg\b/i.test(out)) return out;
  if(!/\bviewBox=/i.test(out)){
    const wm=out.match(/\bwidth=["']([\d.]+)/i);
    const hm=out.match(/\bheight=["']([\d.]+)/i);
    const w=(wm&&parseFloat(wm[1]))||256;
    const h=(hm&&parseFloat(hm[1]))||256;
    out=out.replace(/<svg\b/i,'<svg viewBox="0 0 '+w+' '+h+'"');
  }
  if(fillMode||fixedSize){
    const wAttr=fixedSize?(fixedSize+'px'):'100%';
    const hAttr=fixedSize?(fixedSize+'px'):'100%';
    out=out
      .replace(/\swidth=["'][^"']*["']/i,'')
      .replace(/\sheight=["'][^"']*["']/i,'')
      .replace(/\spreserveAspectRatio=["'][^"']*["']/i,'')
      .replace(/<svg\b/i,'<svg preserveAspectRatio="xMidYMid meet" width="'+wAttr+'" height="'+hAttr+'"');
  }
  return out;
}

function parseSvgTransform(str){
  let m=[1,0,0,1,0,0];
  if(!str) return m;
  const mul=(a,b)=>[
    a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1],
    a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3],
    a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]
  ];
  const re=/([a-zA-Z]+)\s*\(([^)]*)\)/g;
  let match;
  while((match=re.exec(str))!==null){
    const fn=match[1].toLowerCase();
    const n=(match[2].match(/[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g)||[]).map(Number).filter(Number.isFinite);
    if(fn==='matrix' && n.length>=6) m=mul(m,n.slice(0,6));
    else if(fn==='translate' && n.length>=1) m=mul(m,[1,0,0,1,n[0],n[1]||0]);
    else if(fn==='scale' && n.length>=1) m=mul(m,[n[0],0,0,n.length>1?n[1]:n[0],0,0]);
    else if(fn==='rotate' && n.length>=1){
      const r=(n[0]*Math.PI)/180, c=Math.cos(r), s=Math.sin(r), cx=n[1]||0, cy=n[2]||0;
      m=mul(m,[1,0,0,1,cx,cy]); m=mul(m,[c,s,-s,c,0,0]); m=mul(m,[1,0,0,1,-cx,-cy]);
    }else if(fn==='skewx' && n.length>=1) m=mul(m,[1,0,Math.tan((n[0]*Math.PI)/180),1,0,0]);
    else if(fn==='skewy' && n.length>=1) m=mul(m,[1,Math.tan((n[0]*Math.PI)/180),0,1,0,0]);
  }
  return m;
}

function arcEndpointToCenter(x1,y1,rx0,ry0,phiDeg,large,sweep,x2,y2){
  let rx=Math.abs(rx0), ry=Math.abs(ry0);
  if(rx<1e-6||ry<1e-6) return null;
  const phi=(phiDeg*Math.PI)/180, cp=Math.cos(phi), sp=Math.sin(phi);
  const dx2=(x1-x2)/2, dy2=(y1-y2)/2;
  const x1p=cp*dx2+sp*dy2, y1p=-sp*dx2+cp*dy2;
  const lam=(x1p*x1p)/(rx*rx)+(y1p*y1p)/(ry*ry);
  if(lam>1){ const sc=Math.sqrt(lam); rx*=sc; ry*=sc; }
  const rx2=rx*rx, ry2=ry*ry, x1p2=x1p*x1p, y1p2=y1p*y1p;
  const num=Math.max(0,rx2*ry2-rx2*y1p2-ry2*x1p2);
  const den=rx2*y1p2+ry2*x1p2;
  if(den<1e-9) return null;
  const factor=(large===sweep?-1:1)*Math.sqrt(num/den);
  const cxp=factor*((rx*y1p)/ry), cyp=factor*(-(ry*x1p)/rx);
  const cx=cp*cxp-sp*cyp+(x1+x2)/2, cy=sp*cxp+cp*cyp+(y1+y2)/2;
  const ang=(ux,uy,vx,vy)=>{
    const dot=ux*vx+uy*vy, len=Math.hypot(ux,uy)*Math.hypot(vx,vy);
    const a=Math.acos(Math.max(-1,Math.min(1,dot/(len||1))));
    return ux*vy-uy*vx<0?-a:a;
  };
  const t1=ang(1,0,(x1p-cxp)/rx,(y1p-cyp)/ry);
  let dt=ang((x1p-cxp)/rx,(y1p-cyp)/ry,(-x1p-cxp)/rx,(-y1p-cyp)/ry);
  if(!sweep && dt>0) dt-=Math.PI*2;
  if(sweep && dt<0) dt+=Math.PI*2;
  return {cx,cy,rx,ry,phi,t1,dt};
}

function parseLogoAnatomy(svgText){
  const parser=new DOMParser();
  const doc=parser.parseFromString(String(svgText||''),'image/svg+xml');
  const root=doc.documentElement;
  let vb=[0,0,256,256];
  if(root && !doc.querySelector('parsererror')){
    const rawVb=(root.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
    if(rawVb.length===4 && rawVb.every(Number.isFinite) && rawVb[2]>0 && rawVb[3]>0){
      vb=rawVb;
    }else{
      const w=parseFloat(root.getAttribute('width')||'256')||256;
      const h=parseFloat(root.getAttribute('height')||'256')||256;
      vb=[0,0,w,h];
    }
  }
  const minDim=Math.min(vb[2],vb[3])||256;
  const dedupTol=minDim*0.0025;
  const anchors=[], handles=[], segments=[], circles=[], inkPts=[];
  const anglesSet=new Set(), colorSet=new Set(), findings=[];
  if(!root || root.localName!=='svg' || doc.querySelector('parsererror')){
    return {viewBox:vb,inkBox:vb,shapes:0,anchors,handles,segments,circles,anglesDeg:[],colors:[],score:0,findings:[{level:'fail',message:'Could not parse SVG document.'}]};
  }
  let shapeCount=0;
  let hasText=false, hasFilter=false, hasRaster=false;
  const idMap=new Map();
  root.querySelectorAll('[id]').forEach(el=>idMap.set(el.getAttribute('id'),el));
  root.querySelectorAll('[fill],[stroke],stop').forEach(el=>{
    if(el.closest('defs,clipPath,mask,pattern')) return;
    [el.getAttribute('fill'),el.getAttribute('stroke'),el.getAttribute('stop-color')].forEach(c=>{
      if(c && /^#|^rgb|^hsl/i.test(c.trim()) && !/^(none|transparent|currentcolor)$/i.test(c.trim())){
        colorSet.add(c.trim().toLowerCase());
      }
    });
  });

  const xf=(m,x,y)=>[m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]];
  const mulM=(a,b)=>[
    a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1],
    a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3],
    a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]
  ];
  const recSeg=(ax,ay,bx,by)=>{
    const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy);
    if(len<dedupTol) return;
    let deg=(Math.atan2(dy,dx)*180)/Math.PI;
    if(deg<0) deg+=180;
    if(deg>=180) deg-=180;
    anglesSet.add(Math.round(deg*10)/10);
    segments.push({x1:ax,y1:ay,x2:bx,y2:by,len,angle:deg});
  };
  const pushAnc=(x,y,smooth)=>{
    if(!Number.isFinite(x)||!Number.isFinite(y)) return;
    inkPts.push([x,y]);
    // Skip duplicate coincident closing vertex if directly onto previous point
    const prev=anchors[anchors.length-1];
    if(prev && Math.hypot(prev.x-x,prev.y-y)<dedupTol){ if(smooth) prev.smooth=true; return; }
    anchors.push({x,y,smooth:Boolean(smooth)});
  };
  const pushHnd=(ax,ay,cx,cy)=>{
    if(!Number.isFinite(ax)||!Number.isFinite(ay)||!Number.isFinite(cx)||!Number.isFinite(cy)) return;
    if(Math.hypot(cx-ax,cy-ay)<dedupTol) return;
    handles.push({anchor:{x:ax,y:ay},control:{x:cx,y:cy}});
  };
  const sampleCubic=(p0,p1,p2,p3)=>{
    for(const t of [0.25,0.5,0.75]){
      const mt=1-t, b0=mt*mt*mt, b1=3*mt*mt*t, b2=3*mt*t*t, b3=t*t*t;
      inkPts.push([b0*p0[0]+b1*p1[0]+b2*p2[0]+b3*p3[0], b0*p0[1]+b1*p1[1]+b2*p2[1]+b3*p3[1]]);
    }
  };
  const sampleQuad=(p0,p1,p2)=>{
    for(const t of [0.25,0.5,0.75]){
      const mt=1-t, b0=mt*mt, b1=2*mt*t, b2=t*t;
      inkPts.push([b0*p0[0]+b1*p1[0]+b2*p2[0], b0*p0[1]+b1*p1[1]+b2*p2[1]]);
    }
  };

  const inspectEl=(el,ctm)=>{
    const tag=el.localName;
    if(['defs','clippath','mask','pattern','marker','style','script'].includes(tag)) return;
    const nextCtm=mulM(ctm,parseSvgTransform(el.getAttribute('transform')));
    if(tag==='text'||tag==='tspan'){ hasText=true; }
    if(tag==='filter'){ hasFilter=true; }
    if(tag==='image'){ hasRaster=true; }
    if(tag==='use'){
      const href=(el.getAttribute('href')||el.getAttribute('xlink:href')||'').replace(/^#/,'');
      const target=href?idMap.get(href):null;
      if(target){
        const ux=parseFloat(el.getAttribute('x')||'0')||0, uy=parseFloat(el.getAttribute('y')||'0')||0;
        const useCtm=mulM(nextCtm,[1,0,0,1,ux,uy]);
        if(target.localName==='path'||target.localName==='rect'||target.localName==='circle'||target.localName==='ellipse'||target.localName==='polygon'||target.localName==='polyline'||target.localName==='line'||target.localName==='g'){
          const cloneTag=target.localName;
          if(cloneTag==='g'){ [...target.children].forEach(ch=>inspectEl(ch,useCtm)); }
          else{ parseLeaf(target,useCtm); }
        }
      }
      return;
    }
    if(['path','rect','circle','ellipse','polygon','polyline','line'].includes(tag)){
      parseLeaf(el,nextCtm);
      return;
    }
    for(const ch of [...el.children]) inspectEl(ch,nextCtm);
  };

  const parseLeaf=(el,m)=>{
    shapeCount++;
    const tag=el.localName;
    const sc=Math.sqrt(Math.abs(m[0]*m[3]-m[1]*m[2]))||1;
    if(tag==='rect'){
      const x=parseFloat(el.getAttribute('x')||'0')||0, y=parseFloat(el.getAttribute('y')||'0')||0;
      const w=parseFloat(el.getAttribute('width')||'0')||0, h=parseFloat(el.getAttribute('height')||'0')||0;
      const rx=Math.min(w/2,parseFloat(el.getAttribute('rx')||el.getAttribute('ry')||'0')||0);
      const pts=rx>dedupTol
        ? [[x+rx,y],[x+w-rx,y],[x+w,y+rx],[x+w,y+h-rx],[x+w-rx,y+h],[x+rx,y+h],[x,y+h-rx],[x,y+rx]]
        : [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
      const tPts=pts.map(p=>xf(m,p[0],p[1]));
      tPts.forEach((p,i)=>{
        pushAnc(p[0],p[1],rx>dedupTol);
        const nxt=tPts[(i+1)%tPts.length];
        recSeg(p[0],p[1],nxt[0],nxt[1]);
      });
    }else if(tag==='circle'||tag==='ellipse'){
      const cx=parseFloat(el.getAttribute('cx')||'0')||0, cy=parseFloat(el.getAttribute('cy')||'0')||0;
      const rx=parseFloat(el.getAttribute(tag==='circle'?'r':'rx')||'0')||0;
      const ry=parseFloat(el.getAttribute(tag==='circle'?'r':'ry')||'0')||0;
      const cT=xf(m,cx,cy);
      if(rx>0 && Math.abs(rx-ry)<0.05*Math.max(rx,ry)) circles.push({cx:cT[0],cy:cT[1],r:rx*sc});
      const k=0.55228475;
      const card=[[cx,cy-ry,cx+k*rx,cy-ry,cx-k*rx,cy-ry],[cx+rx,cy,cx+rx,cy+k*ry,cx+rx,cy-k*ry],[cx,cy+ry,cx-k*rx,cy+ry,cx+k*rx,cy+ry],[cx-rx,cy,cx-rx,cy-k*ry,cx-rx,cy+k*ry]];
      card.forEach(([px,py,h1x,h1y,h2x,h2y])=>{
        const pt=xf(m,px,py), t1=xf(m,h1x,h1y), t2=xf(m,h2x,h2y);
        pushAnc(pt[0],pt[1],true); pushHnd(pt[0],pt[1],t1[0],t1[1]); pushHnd(pt[0],pt[1],t2[0],t2[1]);
      });
      for(let a=0;a<Math.PI*2;a+=Math.PI/8) inkPts.push(xf(m,cx+rx*Math.cos(a),cy+ry*Math.sin(a)));
    }else if(tag==='line'){
      const p1=xf(m,parseFloat(el.getAttribute('x1')||'0')||0,parseFloat(el.getAttribute('y1')||'0')||0);
      const p2=xf(m,parseFloat(el.getAttribute('x2')||'0')||0,parseFloat(el.getAttribute('y2')||'0')||0);
      pushAnc(p1[0],p1[1],false); pushAnc(p2[0],p2[1],false); recSeg(p1[0],p1[1],p2[0],p2[1]);
    }else if(tag==='polygon'||tag==='polyline'){
      const nums=(el.getAttribute('points')||'').match(/[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g)||[];
      const tPts=[];
      for(let i=0;i+1<nums.length;i+=2){ const p=xf(m,Number(nums[i]),Number(nums[i+1])); tPts.push(p); pushAnc(p[0],p[1],false); }
      for(let i=0;i<tPts.length-(tag==='polyline'?1:0);i++){ const nxt=tPts[(i+1)%tPts.length]; recSeg(tPts[i][0],tPts[i][1],nxt[0],nxt[1]); }
    }else if(tag==='path'){
      const d=el.getAttribute('d')||'';
      const toks=d.match(/[a-zA-Z]|[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g)||[];
      let idx=0, cx=0, cy=0, sx=0, sy=0, cmd='M', lastOp='', lastC2=null, lastQ=null;
      let subPts=[], subHasCurve=false, subClosed=false;
      const flushSub=()=>{
        // Detect closed circular Bezier paths (common SVGO output for <circle>)
        if(subClosed && subHasCurve && subPts.length>=4 && subPts.length<=8){
          let mx0=Infinity,my0=Infinity,mx1=-Infinity,my1=-Infinity;
          for(const pt of subPts){ mx0=Math.min(mx0,pt[0]); my0=Math.min(my0,pt[1]); mx1=Math.max(mx1,pt[0]); my1=Math.max(my1,pt[1]); }
          const bw=mx1-mx0, bh=my1-my0, rEst=(bw+bh)/4;
          if(rEst>minDim*0.03 && Math.abs(bw-bh)<rEst*0.08){
            const ccx=(mx0+mx1)/2, ccy=(my0+my1)/2;
            const onCircle=subPts.every(pt=>Math.abs(Math.hypot(pt[0]-ccx,pt[1]-ccy)-rEst)<rEst*0.06);
            if(onCircle) circles.push({cx:ccx,cy:ccy,r:rEst});
          }
        }
        subPts=[]; subHasCurve=false; subClosed=false;
      };
      const num=()=>{ const v=Number(toks[idx++]); return Number.isFinite(v)?v:0; };
      while(idx<toks.length){
        if(/^[a-zA-Z]$/.test(toks[idx])){
          cmd=toks[idx++];
          if(cmd==='Z'||cmd==='z'){
            const pA=xf(m,cx,cy), pB=xf(m,sx,sy);
            recSeg(pA[0],pA[1],pB[0],pB[1]);
            if(anchors.length && subPts.length>1 && Math.hypot(pA[0]-pB[0],pA[1]-pB[1])<dedupTol) anchors.pop();
            subClosed=true; flushSub();
            cx=sx; cy=sy; lastOp='Z'; lastC2=null; lastQ=null; continue;
          }
        }
        const rel=cmd>='a'&&cmd<='z', op=cmd.toUpperCase();
        if(op==='M'){
          flushSub();
          const x=num()+(rel?cx:0), y=num()+(rel?cy:0), tp=xf(m,x,y);
          sx=x; sy=y; cx=x; cy=y; pushAnc(tp[0],tp[1],false); subPts.push(tp);
          cmd=rel?'l':'L'; lastOp='M'; lastC2=null; lastQ=null;
        }else if(op==='L'){
          const x=num()+(rel?cx:0), y=num()+(rel?cy:0), p0=xf(m,cx,cy), p1=xf(m,x,y);
          recSeg(p0[0],p0[1],p1[0],p1[1]); pushAnc(p1[0],p1[1],false); subPts.push(p1);
          cx=x; cy=y; lastOp='L'; lastC2=null; lastQ=null;
        }else if(op==='H'){
          const x=num()+(rel?cx:0), p0=xf(m,cx,cy), p1=xf(m,x,cy);
          recSeg(p0[0],p0[1],p1[0],p1[1]); pushAnc(p1[0],p1[1],false); subPts.push(p1);
          cx=x; lastOp='H'; lastC2=null; lastQ=null;
        }else if(op==='V'){
          const y=num()+(rel?cy:0), p0=xf(m,cx,cy), p1=xf(m,cx,y);
          recSeg(p0[0],p0[1],p1[0],p1[1]); pushAnc(p1[0],p1[1],false); subPts.push(p1);
          cy=y; lastOp='V'; lastC2=null; lastQ=null;
        }else if(op==='C'||op==='S'){
          const hasC2=lastC2&&(lastOp==='C'||lastOp==='S');
          const x1=op==='C'?(num()+(rel?cx:0)):(hasC2?(2*cx-lastC2[0]):cx);
          const y1=op==='C'?(num()+(rel?cy:0)):(hasC2?(2*cy-lastC2[1]):cy);
          const x2=num()+(rel?cx:0), y2=num()+(rel?cy:0), x=num()+(rel?cx:0), y=num()+(rel?cy:0);
          const p0=xf(m,cx,cy), p1=xf(m,x1,y1), p2=xf(m,x2,y2), p3=xf(m,x,y);
          if(anchors.length) anchors[anchors.length-1].smooth=true;
          pushHnd(p0[0],p0[1],p1[0],p1[1]); pushHnd(p3[0],p3[1],p2[0],p2[1]);
          pushAnc(p3[0],p3[1],true); sampleCubic(p0,p1,p2,p3); subPts.push(p3); subHasCurve=true;
          lastC2=[x2,y2]; lastQ=null; cx=x; cy=y; lastOp=op;
        }else if(op==='Q'||op==='T'){
          const hasQ=lastQ&&(lastOp==='Q'||lastOp==='T');
          const qx=op==='Q'?(num()+(rel?cx:0)):(hasQ?(2*cx-lastQ[0]):cx);
          const qy=op==='Q'?(num()+(rel?cy:0)):(hasQ?(2*cy-lastQ[1]):cy);
          const x=num()+(rel?cx:0), y=num()+(rel?cy:0);
          const p0=xf(m,cx,cy), p1=xf(m,qx,qy), p2=xf(m,x,y);
          if(anchors.length) anchors[anchors.length-1].smooth=true;
          pushHnd(p0[0],p0[1],p1[0],p1[1]); pushHnd(p2[0],p2[1],p1[0],p1[1]);
          pushAnc(p2[0],p2[1],true); sampleQuad(p0,p1,p2); subPts.push(p2); subHasCurve=true;
          lastQ=[qx,qy]; lastC2=null; cx=x; cy=y; lastOp=op;
        }else if(op==='A'){
          const rx=num(), ry=num(), rot=num();
          const f1=toks[idx]||'0';
          if(/^[01]{2,}$/.test(f1)) toks.splice(idx,1,f1[0],f1[1],...(f1.length>2?[f1.slice(2)]:[]));
          else if(/^[01][01]/.test(f1)&&f1.length>1) toks.splice(idx,1,f1[0],f1.slice(1));
          const large=num();
          const f2=toks[idx]||'0';
          if(/^[01].+/.test(f2)&&f2.length>1) toks.splice(idx,1,f2[0],f2.slice(1));
          const sweep=num(), x=num()+(rel?cx:0), y=num()+(rel?cy:0);
          const arc=arcEndpointToCenter(cx,cy,rx,ry,rot,Boolean(large),Boolean(sweep),x,y);
          if(arc){
            if(Math.abs(arc.rx-arc.ry)<0.05*Math.max(arc.rx,arc.ry) && Math.abs(arc.dt)>Math.PI*0.35){
              const ac=xf(m,arc.cx,arc.cy);
              circles.push({cx:ac[0],cy:ac[1],r:arc.rx*sc});
            }
            for(const f of [0.25,0.5,0.75]){
              const t=arc.t1+arc.dt*f, cp=Math.cos(arc.phi), sp=Math.sin(arc.phi);
              const ex=arc.rx*Math.cos(t), ey=arc.ry*Math.sin(t);
              inkPts.push(xf(m,arc.cx+cp*ex-sp*ey,arc.cy+sp*ex+cp*ey));
            }
          }
          const tp=xf(m,x,y);
          if(anchors.length) anchors[anchors.length-1].smooth=true;
          pushAnc(tp[0],tp[1],true); subPts.push(tp); subHasCurve=true;
          cx=x; cy=y; lastOp='A'; lastC2=null; lastQ=null;
        }else{ idx++; }
      }
      flushSub();
    }
  };

  inspectEl(root,[1,0,0,1,0,0]);

  let ix0=Infinity, iy0=Infinity, ix1=-Infinity, iy1=-Infinity;
  for(const [x,y] of inkPts){
    if(x<ix0) ix0=x; if(y<iy0) iy0=y; if(x>ix1) ix1=x; if(y>iy1) iy1=y;
  }
  const inkBox=Number.isFinite(ix0)&&ix1>ix0&&iy1>iy0?[ix0,iy0,ix1,iy1]:vb;

  let score=100;
  if(hasText){ score-=25; findings.push({level:'fail',message:'Contains live <text>: final logos should convert type to outlined paths.'}); }
  if(hasRaster){ score-=30; findings.push({level:'fail',message:'Contains embedded raster <image> rather than pure vectors.'}); }
  if(hasFilter){ score-=10; findings.push({level:'warn',message:'Uses SVG <filter> effects; maintain a flat vector master alongside.'}); }
  if(colorSet.size>4){ score-=10; findings.push({level:'warn',message:colorSet.size+' colours detected (~75% of enduring logos use \u2264 3).'}); }
  if(anchors.length>160){ score-=10; findings.push({level:'warn',message:anchors.length+' anchors may plug counters at 16px favicon scale.'}); }
  const nearMiss=[...anglesSet].filter(a=>CLEAN_ANGLES.some(clean=>{ const diff=Math.abs(a-clean); return diff>=0.4 && diff<=2.5; }));
  if(nearMiss.length){
    score-=6;
    findings.push({level:'warn',message:'Near-miss angles ('+nearMiss.slice(0,3).map(d=>d+'\u00b0').join(', ')+'): snap toward 15\u00b0/30\u00b0/45\u00b0/90\u00b0 axes.'});
  }
  if(!findings.length){
    findings.push({
      level:'pass',
      message:shapeCount+' '+(shapeCount===1?'vector element':'vector elements')+' \u00b7 '+anchors.length+' '+(anchors.length===1?'anchor':'anchors')+' \u00b7 clean geometry'
    });
  }
  return {viewBox:vb,inkBox,shapes:shapeCount,anchors,handles,segments,circles,anglesDeg:[...anglesSet].sort((a,b)=>a-b),colors:[...colorSet],score:Math.max(0,score),findings};
}

/* ---------- design sourcebook custom dropdowns ---------- */
let dsOpenMenu=null;
function closeDsSelectMenu(restoreFocus){
  if(!dsOpenMenu) return;
  const {menu,btn,onDoc,onScroll,onKey}=dsOpenMenu;
  document.removeEventListener('pointerdown',onDoc,true);
  window.removeEventListener('scroll',onScroll,true);
  window.removeEventListener('resize',onScroll);
  document.removeEventListener('keydown',onKey,true);
  menu.remove();
  btn.setAttribute('aria-expanded','false');
  dsOpenMenu=null;
  if(restoreFocus) btn.focus({preventScroll:true});
}
function splitOptMeta(text){
  const m=String(text||'').match(/^(.*?)\s*\(([^()]+)\)\s*$/);
  return m?{label:m[1],meta:m[2]}:{label:String(text||''),meta:''};
}
function syncDsSelect(sel){
  if(!sel||!sel._dsWrap) return;
  const wrap=sel._dsWrap;
  const btn=wrap.querySelector('.ds-select-btn');
  const lblEl=btn.querySelector('.ds-select-label');
  const metaEl=btn.querySelector('.ds-select-meta');
  const curOpt=sel.options[sel.selectedIndex]||sel.options[0];
  const parsed=splitOptMeta(curOpt?curOpt.textContent:'');
  lblEl.textContent=parsed.label;
  metaEl.textContent=parsed.meta;
  metaEl.style.display=parsed.meta?'':'none';
  const isDefault=!sel.value||sel.value==='all';
  wrap.classList.toggle('is-filtered',!isDefault);
}
function openDsSelectMenu(sel){
  const wrap=sel._dsWrap;
  const btn=wrap&&wrap.querySelector('.ds-select-btn');
  if(!wrap||!btn) return;
  if(dsOpenMenu&&dsOpenMenu.sel===sel){ closeDsSelectMenu(false); return; }
  closeDsSelectMenu(false);

  const menu=document.createElement('div');
  menu.className='ds-select-menu';
  menu.setAttribute('role','listbox');
  const opts=[...sel.options];
  const showSearch=opts.length>8;
  let searchQ='';
  let activeIdx=Math.max(0,sel.selectedIndex);

  if(showSearch){
    const sBox=document.createElement('div');
    sBox.className='ds-select-search';
    sBox.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" placeholder="Filter options\u2026" autocomplete="off">';
    menu.appendChild(sBox);
  }
  const listEl=document.createElement('div');
  listEl.className='ds-select-list';
  menu.appendChild(listEl);

  const getFiltered=()=>opts.filter(o=>!searchQ||o.textContent.toLowerCase().includes(searchQ));
  const choose=(val)=>{
    closeDsSelectMenu(true);
    if(sel.value!==val){
      sel.value=val;
      syncDsSelect(sel);
      sel.dispatchEvent(new Event('change',{bubbles:true}));
    }
  };

  const renderOpts=()=>{
    const filtered=getFiltered();
    if(!filtered.length){
      listEl.innerHTML='<div class="ds-select-empty">No matching options</div>';
      return;
    }
    if(activeIdx>=filtered.length) activeIdx=0;
    listEl.innerHTML='';
    filtered.forEach((opt,i)=>{
      if(i===1&&!searchQ&&opts[0]&&(opts[0].value===''||opts[0].value==='all')){
        const sep=document.createElement('div');
        sep.className='ds-select-sep';
        listEl.appendChild(sep);
      }
      const p=splitOptMeta(opt.textContent);
      const b=document.createElement('button');
      b.type='button';
      b.className='ds-select-opt'+(i===activeIdx?' is-active':'');
      b.setAttribute('role','option');
      b.setAttribute('aria-selected',String(opt.value===sel.value));
      b.innerHTML='<span class="ds-select-opt-main"><span>'+esc(p.label)+'</span></span>'+
        '<span class="ds-select-opt-right">'+(p.meta?'<span class="ds-select-opt-cnt">'+esc(p.meta)+'</span>':'')+
        '<svg class="ds-select-opt-chk" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"/></svg></span>';
      b.addEventListener('mouseenter',()=>{ activeIdx=i; });
      b.addEventListener('click',()=>choose(opt.value));
      listEl.appendChild(b);
    });
    const curBtn=listEl.children[Math.min(activeIdx+(searchQ?0:1),listEl.children.length-1)];
    if(curBtn&&curBtn.scrollIntoView) curBtn.scrollIntoView({block:'nearest'});
  };

  renderOpts();
  document.body.appendChild(menu);
  btn.setAttribute('aria-expanded','true');

  const positionMenu=()=>{
    const rect=btn.getBoundingClientRect();
    const mw=Math.max(224,Math.round(rect.width));
    menu.style.minWidth=mw+'px';
    const mh=menu.offsetHeight||280;
    const spaceBelow=window.innerHeight-rect.bottom-10;
    const spaceAbove=rect.top-10;
    const openUp=spaceBelow<Math.min(mh,220)&&spaceAbove>spaceBelow;
    const top=openUp?Math.max(8,rect.top-mh-6):Math.min(window.innerHeight-mh-8,rect.bottom+6);
    const left=Math.min(Math.max(8,rect.left),Math.max(8,window.innerWidth-menu.offsetWidth-8));
    menu.style.top=Math.round(top)+'px';
    menu.style.left=Math.round(left)+'px';
  };
  positionMenu();

  const searchIn=menu.querySelector('.ds-select-search input');
  if(searchIn){
    searchIn.addEventListener('input',e=>{
      searchQ=e.target.value.trim().toLowerCase();
      activeIdx=0;
      renderOpts();
      positionMenu();
    });
    setTimeout(()=>searchIn.focus({preventScroll:true}),0);
  }

  const onDoc=e=>{
    const t=e&&e.target;
    if(t instanceof Node&&(menu.contains(t)||wrap.contains(t))) return;
    closeDsSelectMenu(false);
  };
  const onScroll=e=>{
    const t=e&&e.target;
    if(t instanceof Node&&menu.contains(t)) return;
    closeDsSelectMenu(false);
  };
  const onKey=e=>{
    const filtered=getFiltered();
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeDsSelectMenu(true); return; }
    if(!filtered.length) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); activeIdx=(activeIdx+1)%filtered.length; renderOpts(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); activeIdx=(activeIdx-1+filtered.length)%filtered.length; renderOpts(); }
    else if(e.key==='Home'){ e.preventDefault(); activeIdx=0; renderOpts(); }
    else if(e.key==='End'){ e.preventDefault(); activeIdx=filtered.length-1; renderOpts(); }
    else if(e.key==='Enter'){
      if(document.activeElement===searchIn||!menu.contains(document.activeElement)||document.activeElement?.classList.contains('ds-select-opt')){
        e.preventDefault();
        choose(filtered[activeIdx].value);
      }
    }
  };
  document.addEventListener('pointerdown',onDoc,true);
  window.addEventListener('scroll',onScroll,true);
  window.addEventListener('resize',onScroll);
  document.addEventListener('keydown',onKey,true);
  dsOpenMenu={sel,menu,btn,onDoc,onScroll,onKey};
}
function wrapDsSelect(sel){
  if(!sel||sel._dsWrap) return sel?._dsWrap;
  const wrap=document.createElement('div');
  wrap.className='ds-select';
  sel.parentNode.insertBefore(wrap,sel);
  wrap.appendChild(sel);
  sel.className='ds-select-native';
  sel.tabIndex=-1;
  sel.setAttribute('aria-hidden','true');

  const btn=document.createElement('button');
  btn.type='button';
  btn.className='ds-select-btn';
  btn.setAttribute('aria-haspopup','listbox');
  btn.setAttribute('aria-expanded','false');
  if(sel.getAttribute('aria-label')) btn.setAttribute('aria-label',sel.getAttribute('aria-label'));
  btn.innerHTML='<span class="ds-select-dot"></span><span class="ds-select-label"></span><span class="ds-select-meta"></span>'+
    '<svg class="ds-select-chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
  btn.addEventListener('click',()=>openDsSelectMenu(sel));
  btn.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key===' '){
      e.preventDefault();
      openDsSelectMenu(sel);
    }
  });
  wrap.appendChild(btn);
  sel._dsWrap=wrap;
  syncDsSelect(sel);
  return wrap;
}
function setDsSelectVisible(id,vis){
  const sel=document.getElementById(id);
  if(!sel) return;
  if(sel._dsWrap) sel._dsWrap.style.display=vis?'':'none';
  else sel.style.display=vis?'':'none';
}

    '</div>';

  const packSel=document.getElementById('ldbPack');
  Object.entries(ICON_PACKS).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([id,pk])=>{
    const opt=document.createElement('option');
    opt.value=id;
    opt.textContent=id+' ('+(pk.grid||24)+'px)';
    packSel.appendChild(opt);
  });

  ['ldbMarkType','ldbTechnique','ldbIndustry','ldbPack'].forEach(id=>wrapDsSelect(document.getElementById(id)));

  logosEl.querySelectorAll('[data-ldb-tab]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const next=btn.dataset.ldbTab;
      if(logoState.subTab===next) return;
      logoState.subTab=next;
      syncLogoControls();
      if(next==='logos') fetchLogos();
      else renderIconPackGrid();
    });
  });

  ['ldbMarkType','ldbTechnique','ldbIndustry'].forEach((id,i)=>{
    const keys=['markType','technique','industry'];
    document.getElementById(id).addEventListener('change',e=>{
      logoState[keys[i]]=e.target.value;
      logoState.page=1;
      syncLogoControls();
      fetchLogos();
    });
  });

  packSel.addEventListener('change',e=>{
    logoState.packFilter=e.target.value;
    logoState.iconPage=1;
    syncLogoControls();
    renderIconPackGrid();
  });

  document.getElementById('ldbExBtn').addEventListener('click',()=>{
    logoState.onlyExemplary=!logoState.onlyExemplary;
    logoState.page=1;
    syncLogoControls();
    fetchLogos();
  });

  document.getElementById('ldbResetBtn').addEventListener('click',()=>{
    logoState.q=''; logoState.industry=''; logoState.markType=''; logoState.technique='';
    logoState.onlyExemplary=false; logoState.packFilter='all'; logoState.page=1; logoState.iconPage=1;
    state.q='';
    const topQ=document.getElementById('q');
    if(topQ) topQ.value='';
    ['ldbMarkType','ldbTechnique','ldbIndustry'].forEach(id=>{
      const s=document.getElementById(id); if(s){ s.value=''; syncDsSelect(s); }
    });
    if(packSel){ packSel.value='all'; syncDsSelect(packSel); }
    syncLogoControls();
    if(logoState.subTab==='logos') fetchLogos();
    else renderIconPackGrid();
  });

  renderLogoStats();
}

function scheduleLogosRefresh(){
  if(logoState.subTab==='icons'){ renderIconPackGrid(); return; }
  clearTimeout(logoState.debounceT);
  logoState.debounceT=setTimeout(()=>fetchLogos(),150);
}

function syncLogoControls(){
  if(!logoState.shellBuilt) return;
  const isLogos=logoState.subTab==='logos';
  logosEl.querySelectorAll('[data-ldb-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ldbTab===logoState.subTab)));
  setDsSelectVisible('ldbMarkType',isLogos);
  setDsSelectVisible('ldbTechnique',isLogos);
  setDsSelectVisible('ldbIndustry',isLogos);
  setDsSelectVisible('ldbPack',!isLogos);
  ['ldbMarkType','ldbTechnique','ldbIndustry','ldbPack'].forEach(id=>syncDsSelect(document.getElementById(id)));
  document.getElementById('ldbExBtn').style.display=isLogos?'':'none';
  document.getElementById('ldbExBtn').setAttribute('aria-pressed',String(logoState.onlyExemplary));
  const hasAny=Boolean(logoState.q.trim()||(isLogos?(logoState.markType||logoState.technique||logoState.industry||logoState.onlyExemplary):(logoState.packFilter!=='all')));
  const rst=document.getElementById('ldbResetBtn');
  if(rst) rst.style.display=hasAny?'':'none';
}

async function loadLogoStats(){
  if(logoState.stats || !location.protocol.startsWith('http')) return;
  try{
    const res=await fetch('/api/logos?stats=1');
    if(!res.ok) return;
    const j=await res.json();
    if(j && j.ok){ logoState.stats=j; renderLogoStats(); }
  }catch(_){}
}

async function fetchLogos(){
  buildLogoDbShell();
  syncLogoControls();
  const gridEl=document.getElementById('ldbGrid');
  const pagerBox=document.getElementById('ldbPager');
  if(!location.protocol.startsWith('http')){
    gridEl.innerHTML='<div class="empty" style="grid-column:1/-1">Brand Marks require HTTP/Postgres (/api/logos). Switch to <b>UI Icon Packs ('+(Object.keys(ICON_PACKS).length||57)+')</b> above for offline vector browsing.</div>';
    pagerBox.innerHTML='';
    renderLogoInspector();
    return;
  }
  const params=new URLSearchParams({page:String(logoState.page),limit:String(logoState.limit)});
  if(logoState.q.trim()) params.set('q',logoState.q.trim());
  if(logoState.industry) params.set('industry',logoState.industry);
  if(logoState.markType) params.set('mark_type',logoState.markType);
  if(logoState.technique) params.set('technique',logoState.technique);
  if(logoState.onlyExemplary) params.set('exemplary','1');
  const qs=params.toString();

  if(logoQueryCache.has(qs)){
    const cached=logoQueryCache.get(qs);
    logoState.items=cached.items;
    logoState.total=cached.total;
    renderBrandLogoGrid();
    return;
  }

  const tok=++logoState.fetchToken;
  logoState.loading=true;
  if(!logoState.items.length) gridEl.innerHTML='<div class="empty" style="grid-column:1/-1">Loading logos from Neon Postgres\u2026</div>';
  startLoader();
  try{
    const res=await fetch('/api/logos?'+qs);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d=await res.json();
    if(tok!==logoState.fetchToken) return;
    if(d && d.ok){
      const items=d.items||[];
      const total=Number(d.total||0);
      logoState.items=items;
      logoState.total=total;
      logoQueryCache.set(qs,{items,total});
      items.forEach(item=>logoByIdCache.set(item.id,item));
      renderBrandLogoGrid();
    }
  }catch(_){
    if(tok===logoState.fetchToken){
      gridEl.innerHTML='<div class="empty" style="grid-column:1/-1">Could not reach /api/logos. Try refreshing or switch to UI Icon Packs.</div>';
      renderLogoInspector();
    }
  }finally{
    if(tok===logoState.fetchToken) logoState.loading=false;
    stopLoader();
  }
}

function renderBrandLogoGrid(){
  const gridEl=document.getElementById('ldbGrid');
  const pagerBox=document.getElementById('ldbPager');
  if(!gridEl) return;
  const items=logoState.items;
  const metaRight=document.getElementById('ldbMetaRight');
  if(metaRight){
    const start=(logoState.page-1)*logoState.limit+1;
    const end=Math.min(logoState.total,start+items.length-1);
    metaRight.textContent=items.length?(start+'\u2013'+end+' of '+logoState.total):'0';
  }
  if(!items.length){
    logoState.selected=null;
    gridEl.innerHTML='<div class="empty" style="grid-column:1/-1">No logos matched those filters.</div>';
    pagerBox.innerHTML='';
    renderLogoInspector();
    return;
  }
  if(!logoState.selected||!items.some(x=>x.id===logoState.selected.id)){
    logoState.selected=items[0];
  }
  const curId=logoState.selected?.id;
  gridEl.innerHTML=items.map((logo,idx)=>{
    const scoped=ensureSvgBox(scopeSvgIds(logo.svg,'ldb'+idx),false);
    const darkStage=isLightOnlySvg(logo.svg,logo.colors);
    const stripCols=(logo.colors&&logo.colors.length?logo.colors:['#71717a']).slice(0,5).map(c=>'<i style="background:'+safeCss(c)+'"></i>').join('');
    const tag=logo.exemplary
      ? '<span class="vtag" style="color:var(--warn)">'+ICONS.star+' Study</span>'
      : '<span class="vtag">'+esc(logo.markType||'mark')+'</span>';
    return '<div class="ldb-card" data-logo-id="'+esc(logo.id)+'" aria-current="'+String(logo.id===curId)+'" role="button" tabindex="0">'+
      '<div class="ldb-stage'+(darkStage?' is-dark':'')+'">'+scoped+'</div>'+
      '<div class="strip">'+stripCols+'</div>'+
      '<div class="card-body">'+
        '<div class="card-top"><h2>'+esc(logo.brand)+'</h2>'+tag+'</div>'+
        '<p class="card-desc">'+esc(logo.note||logo.subject||((logo.markType||'mark')+' \u00b7 '+(logo.industry||'')))+'</p>'+
        '<div class="card-foot"><span><b>'+Number(logo.anchors||0)+'</b> anchors</span><span class="card-meta-right">'+Number(logo.nColors||1)+'c \u00b7 '+esc((logo.techniques&&logo.techniques[0])||'vector')+'</span></div>'+
      '</div>'+
    '</div>';
  }).join('');

  gridEl.querySelectorAll('.ldb-card[data-logo-id]').forEach(card=>{
    const item=items.find(x=>x.id===card.dataset.logoId);
    const selectCard=()=>{
      if(!item) return;
      logoState.selected=item;
      gridEl.querySelectorAll('.ldb-card[data-logo-id]').forEach(el=>el.setAttribute('aria-current',String(el===card)));
      renderLogoInspector();
    };
    card.addEventListener('click',selectCard);
    card.addEventListener('dblclick',()=>{ if(item) location.hash=logoDetailHashFor(item); });
    card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectCard(); } });
  });

  renderLogoInspector();

  pagerBox.innerHTML=buildPagerHtml(logoState.total,logoState.page,logoState.limit);
  pagerBox.querySelectorAll('[data-pg]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=Number(btn.dataset.pg);
      if(!Number.isFinite(p)||p<1||p===logoState.page) return;
      logoState.page=p;
      runViewTransition('page',()=>{ window.scrollTo(0,0); fetchLogos(); },gridEl);
    });
  });
}

function renderIconPackGrid(){
  buildLogoDbShell();
  syncLogoControls();
  const gridEl=document.getElementById('ldbGrid');
  const pagerBox=document.getElementById('ldbPager');
  const q=(logoState.q||'').trim().toLowerCase();
  const pf=logoState.packFilter;
  const entries=[];
  Object.entries(ICON_PACKS).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([packId,pk])=>{
    if(pf!=='all' && packId!==pf) return;
    (pk.glyphs||[]).forEach(g=>{
      if(q && !g.name.toLowerCase().includes(q) && !packId.toLowerCase().includes(q)) return;
      entries.push({packId,pk,g});
    });
  });

  const total=entries.length;
  const totalPages=Math.max(1,Math.ceil(total/logoState.iconLimit));
  if(logoState.iconPage>totalPages) logoState.iconPage=1;
  const startIdx=(logoState.iconPage-1)*logoState.iconLimit;
  const slice=entries.slice(startIdx,startIdx+logoState.iconLimit);
  const metaRight=document.getElementById('ldbMetaRight');
  if(metaRight){
    metaRight.textContent=total?((startIdx+1)+'\u2013'+(startIdx+slice.length)+' of '+total):'0';
  }

  if(!slice.length){
    logoState.selectedPackItem=null;
    gridEl.innerHTML='<div class="empty" style="grid-column:1/-1">No UI glyphs matched your query.</div>';
    pagerBox.innerHTML='';
    renderLogoInspector();
    return;
  }

  const packItems=slice.map(({packId,pk,g})=>({packId,pk,g,item:makePackLogoItem(packId,pk,g)}));
  if(!logoState.selectedPackItem||!packItems.some(x=>x.item.id===logoState.selectedPackItem.id)){
    logoState.selectedPackItem=packItems[0].item;
  }
  const curId=logoState.selectedPackItem?.id;

  gridEl.innerHTML=packItems.map(({packId,pk,g,item})=>{
    const gridPx=pk.grid||24;
    const thumb=buildSysSvg(pk,g,44,'#fafafa',false);
    const note='Official '+gridPx+'\u00d7'+gridPx+'px grid glyph from '+packId+(pk.version?(' v'+pk.version):'')+'.';
    return '<div class="ldb-card" data-pack-item-id="'+esc(item.id)+'" role="button" tabindex="0" aria-current="'+String(item.id===curId)+'">'+
      '<div class="ldb-stage is-dark is-pack">'+thumb+'</div>'+
      '<div class="strip"><i style="background:#fafafa"></i><i style="background:#71717a"></i></div>'+
      '<div class="card-body">'+
        '<div class="card-top"><h2>'+esc(g.name)+'</h2><span class="vtag">'+esc(packId)+'</span></div>'+
        '<p class="card-desc">'+esc(note)+'</p>'+
        '<div class="card-foot"><span><b>'+gridPx+'px</b> grid</span><span class="card-meta-right">official svg</span></div>'+
      '</div>'+
    '</div>';
  }).join('');

  gridEl.querySelectorAll('.ldb-card[data-pack-item-id]').forEach(card=>{
    const match=packItems.find(x=>x.item.id===card.dataset.packItemId);
    const selectCard=()=>{
      if(!match) return;
      logoState.selectedPackItem=match.item;
      gridEl.querySelectorAll('.ldb-card[data-pack-item-id]').forEach(el=>el.setAttribute('aria-current',String(el===card)));
      renderLogoInspector();
    };
    card.addEventListener('click',selectCard);
    card.addEventListener('dblclick',()=>{ if(match) location.hash=logoDetailHashFor(match.item); });
    card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectCard(); } });
  });

  renderLogoInspector();

  pagerBox.innerHTML=buildPagerHtml(total,logoState.iconPage,logoState.iconLimit);
  pagerBox.querySelectorAll('[data-pg]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=Number(btn.dataset.pg);
      if(!Number.isFinite(p)||p<1||p===logoState.iconPage) return;
      logoState.iconPage=p;
      runViewTransition('page',()=>{ window.scrollTo(0,0); renderIconPackGrid(); },gridEl);
    });
  });
}

function applyLogoHeaderSlabs(item){
  const r=document.documentElement;
  const cols=(item.colors||[]).filter(Boolean);
  applyLogoScrollAccent(item);
  if(cols.length){
    r.style.setProperty('--ds-c1',cols[0]);
    r.style.setProperty('--ds-c2',cols[1]||cols[0]);
    r.style.setProperty('--ds-c3',cols[2]||cols[1]||cols[0]);
    r.classList.add('sys-active');
  }else{
    r.classList.remove('sys-active');
  }
}

function buildLogoXrayOverlayMarkup(anatomy,showGrid,showAnchors){
  if(!showGrid && !showAnchors) return '';
  const vb=anatomy.viewBox, ib=anatomy.inkBox||vb;
  const pxU=Math.max(vb[2]/400,vb[3]/250);
  const swGrid=pxU*1.0, swHandle=pxU*1.15, rAnc=pxU*3.1, rCtrl=pxU*2.3, swAnc=pxU*1.2;
  const iw=Math.max(1e-3,ib[2]-ib[0]), ih=Math.max(1e-3,ib[3]-ib[1]);
  const icx=(ib[0]+ib[2])/2, icy=(ib[1]+ib[3])/2;
  const pad=Math.max(iw,ih)*0.12;
  const gx0=ib[0]-pad, gy0=ib[1]-pad, gx1=ib[2]+pad, gy1=ib[3]+pad;
  let out='';

  if(showGrid){
    const dash=pxU*3.5+' '+pxU*3.5;
    out+='<g fill="none">';
    out+='<g stroke="rgba(14,165,233,0.45)" stroke-width="'+swGrid+'">';
    out+='<line x1="'+gx0+'" y1="'+ib[1]+'" x2="'+gx1+'" y2="'+ib[1]+'"/>';
    out+='<line x1="'+gx0+'" y1="'+ib[3]+'" x2="'+gx1+'" y2="'+ib[3]+'"/>';
    out+='<line x1="'+ib[0]+'" y1="'+gy0+'" x2="'+ib[0]+'" y2="'+gy1+'"/>';
    out+='<line x1="'+ib[2]+'" y1="'+gy0+'" x2="'+ib[2]+'" y2="'+gy1+'"/>';
    out+='</g>';
    out+='<g stroke="rgba(14,165,233,0.62)" stroke-width="'+swGrid+'" stroke-dasharray="'+dash+'">';
    out+='<line x1="'+icx+'" y1="'+gy0+'" x2="'+icx+'" y2="'+gy1+'"/>';
    out+='<line x1="'+gx0+'" y1="'+icy+'" x2="'+gx1+'" y2="'+icy+'"/>';
    out+='</g>';
    const clusterCoords=(vals,minVal,maxVal,midVal,span)=>{
      const tol=span*0.025, edgeTol=span*0.04, groups=[];
      vals.forEach(v=>{
        if(Math.abs(v-minVal)<edgeTol||Math.abs(v-maxVal)<edgeTol||Math.abs(v-midVal)<edgeTol) return;
        const g=groups.find(x=>Math.abs(x.mean-v)<tol);
        if(g){ g.sum+=v; g.n++; g.mean=g.sum/g.n; } else groups.push({sum:v,n:1,mean:v});
      });
      return groups.filter(g=>g.n>=2).sort((a,b)=>b.n-a.n).slice(0,3).map(g=>g.mean);
    };
    const alignX=clusterCoords(anatomy.anchors.map(a=>a.x),ib[0],ib[2],icx,iw);
    const alignY=clusterCoords(anatomy.anchors.map(a=>a.y),ib[1],ib[3],icy,ih);
    if(alignX.length||alignY.length){
      out+='<g stroke="rgba(56,189,248,0.36)" stroke-width="'+(pxU*0.85)+'" stroke-dasharray="'+dash+'">';
      alignX.forEach(x=>{ out+='<line x1="'+x+'" y1="'+gy0+'" x2="'+x+'" y2="'+gy1+'"/>'; });
      alignY.forEach(y=>{ out+='<line x1="'+gx0+'" y1="'+y+'" x2="'+gx1+'" y2="'+y+'"/>'; });
      out+='</g>';
    }
    const clipRay=(x1,y1,x2,y2)=>{
      const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
      if(len<1e-6) return null;
      const ux=dx/len, uy=dy/len, ext=Math.hypot(gx1-gx0,gy1-gy0);
      const ax=x1-ux*ext, ay=y1-uy*ext, bx=x2+ux*ext, by=y2+uy*ext;
      const ddx=bx-ax, ddy=by-ay;
      let t0=0, t1=1;
      for(const [p,q] of [[-ddx,ax-gx0],[ddx,gx1-ax],[-ddy,ay-gy0],[ddy,gy1-ay]]){
        if(Math.abs(p)<1e-9){ if(q<0) return null; }
        else{ const r=q/p; if(p<0){ if(r>t1)return null; if(r>t0)t0=r; }else{ if(r<t0)return null; if(r<t1)t1=r; } }
      }
      return [ax+t0*ddx,ay+t0*ddy,ax+t1*ddx,ay+t1*ddy];
    };
    const nonOrtho=anatomy.segments.filter(s=>s.len>=Math.max(iw,ih)*0.12 && s.angle>2 && Math.abs(s.angle-90)>2 && s.angle<178);
    nonOrtho.sort((a,b)=>b.len-a.len);
    const seenRays=[], uniqueRays=[];
    for(const s of nonOrtho){
      const rad=(s.angle*Math.PI)/180, nx=-Math.sin(rad), ny=Math.cos(rad);
      const off=s.x1*nx+s.y1*ny;
      if(seenRays.some(r=>Math.abs(r.a-s.angle)<2 && Math.abs(r.off-off)<Math.max(iw,ih)*0.03)) continue;
      seenRays.push({a:s.angle,off});
      const seg=clipRay(s.x1,s.y1,s.x2,s.y2);
      if(seg) uniqueRays.push(seg);
      if(uniqueRays.length>=6) break;
    }
    if(uniqueRays.length){
      out+='<g stroke="rgba(245,158,11,0.58)" stroke-width="'+(pxU*0.95)+'" stroke-dasharray="'+dash+'">';
      uniqueRays.forEach(([x1,y1,x2,y2])=>{ out+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>'; });
      out+='</g>';
    }
    const uCircles=[], minSpan=Math.min(vb[2],vb[3])||256;
    for(const c of [...anatomy.circles].sort((a,b)=>b.r-a.r)){
      if(c.r<Math.min(iw,ih)*0.04) continue;
      if(uCircles.some(u=>Math.hypot(u.cx-c.cx,u.cy-c.cy)<minSpan*0.02 && Math.abs(u.r-c.r)<minSpan*0.02)) continue;
      uCircles.push(c);
      if(uCircles.length>=6) break;
    }
    if(uCircles.length){
      const arm=pxU*4;
      out+='<g stroke="rgba(16,185,129,0.7)" stroke-width="'+(pxU*1.05)+'">';
      uCircles.forEach(c=>{
        out+='<circle cx="'+c.cx+'" cy="'+c.cy+'" r="'+c.r+'" stroke-dasharray="'+dash+'"/>';
        out+='<line x1="'+(c.cx-arm)+'" y1="'+c.cy+'" x2="'+(c.cx+arm)+'" y2="'+c.cy+'"/>';
        out+='<line x1="'+c.cx+'" y1="'+(c.cy-arm)+'" x2="'+c.cx+'" y2="'+(c.cy+arm)+'"/>';
      });
      out+='</g>';
    }
    out+='</g>';
  }

  if(showAnchors){
    out+='<g>';
    out+=anatomy.handles.slice(0,140).map(h=>
      '<line x1="'+h.anchor.x+'" y1="'+h.anchor.y+'" x2="'+h.control.x+'" y2="'+h.control.y+'" stroke="#f43f5e" stroke-width="'+swHandle+'"/>'+
      '<circle cx="'+h.control.x+'" cy="'+h.control.y+'" r="'+rCtrl+'" fill="#ffffff" stroke="#f43f5e" stroke-width="'+(pxU*1.1)+'"/>'
    ).join('');
    out+=anatomy.anchors.slice(0,180).map(pt=>
      pt.smooth
        ? '<circle cx="'+pt.x+'" cy="'+pt.y+'" r="'+rAnc+'" fill="#0ea5e9" stroke="#ffffff" stroke-width="'+swAnc+'"/>'
        : '<rect x="'+(pt.x-rAnc)+'" y="'+(pt.y-rAnc)+'" width="'+(rAnc*2)+'" height="'+(rAnc*2)+'" fill="#38bdf8" stroke="#ffffff" stroke-width="'+swAnc+'"/>'
    ).join('');
    out+='</g>';
  }
  return out;
}

function buildLogoDetailHtml(item,ctxOpt){

  const dotsHtml=palCols.slice(0,6).map(c=>'<i style="background:'+safeCss(c)+'"></i>').join('');

  const scales=[16,24,32,48].map((sz,i)=>
    '<div class="comp">'+
      '<div class="comp-stage" style="gap:18px;background:#0c0c0f;min-height:92px">'+
        buildLogoScalePairHtml(item,'sc'+i,sz,needsInvertForDark,needsInvertForLight)+
      '</div>'+
      '<div class="comp-info"><b>'+sz+' \u00d7 '+sz+' px</b><span>Dark ground \u00b7 Light app badge</span></div>'+

  ).join('');

  return '<div class="detail-bar">'+

        '<span class="detail-title" style="font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.02em;margin-left:4px">'+esc(item.brand)+'</span>'+
        '<span class="meta-pill">'+esc(item.markType||'mark')+'</span>'+
        '<span class="meta-pill">'+esc(item.industry||'general')+'</span>'+
        (item.exemplary?'<span class="meta-pill" style="color:var(--warn)">'+ICONS.star+' Study</span>':'')+
      '</div>'+
      '<div class="detail-actions">'+
        '<a href="'+studioLogofxUrl+'" class="pill-btn primary">Open in LogoFX'+ICONS.ext+'</a>'+
        '<a href="'+studioCreateUrl+'" class="pill-btn">Open in Logo Maker'+ICONS.ext+'</a>'+
        '<a href="'+studioBrandUrl+'" class="pill-btn">Use in Brand Maker'+ICONS.ext+'</a>'+
        '<button type="button" class="pill-btn" id="ldbDetailCopySvg">'+ICONS.copy+'Copy SVG</button>'+
        '<button type="button" class="pill-btn" id="ldbDetailCopyJson">'+ICONS.copy+'JSON</button>'+
      '</div>'+
    '</div>'+
    '<div class="hero-wrap">'+
      buildLogoXrayBoxHtml(item,ctx,'insp',{stage:'ldbHeroStage',overlay:'ldbHeroOverlay',grid:'ldbGridBtn',anc:'ldbAncBtn',ground:'ldbGroundBtn'},true)+
      '<div class="spec-bar">'+
        '<div class="spec-cell"><small>Geometry</small><b>'+anatomy.shapes+' '+(anatomy.shapes===1?'shape':'shapes')+' \u00b7 '+anatomy.anchors.length+' '+(anatomy.anchors.length===1?'anchor':'anchors')+'</b><span>ViewBox '+esc(vbStr)+'</span></div>'+
        '<div class="spec-cell"><small>Angles</small><b>'+esc(anglesStr)+'</b><span>'+anatomy.circles.length+' detected '+(anatomy.circles.length===1?'circle':'circles')+'</span></div>'+
        '<div class="spec-cell"><small>Palette</small><div class="spec-dots">'+dotsHtml+'</div><span>'+palCols.length+' '+(palCols.length===1?'token':'tokens')+'</span></div>'+
        '<div class="spec-cell"><small>Craft Audit</small><b>'+anatomy.score+' / 100</b><span>'+esc((anatomy.findings[0]&&anatomy.findings[0].level)||'pass')+'</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="sec"><div class="sec-h"><h2>Micro-Scale Survivability</h2><em>16px to 48px specimens on dark &amp; light badges</em></div>'+
      '<div class="comp-grid">'+scales+'</div></div>'+
    '<div class="sec"><div class="sec-h"><h2>Construction Anatomy &amp; Audit</h2><em>vector analysis &amp; construction rationale</em></div>'+
      (item.note?'<div class="notes" style="margin-bottom:12px"><p>'+esc(item.note)+'</p></div>':'')+
      (chips?'<div class="kinds">'+chips+'</div>':'')+
      '<div class="cmd-stack">'+findingsHtml+'</div></div>'+

function bindLogoDetailInteractions(item,ctx){
  const backBtn=detail.querySelector('[data-logo-back]');
  if(backBtn) backBtn.addEventListener('click',e=>{ e.preventDefault(); location.hash='#/logos'; });
  detail.querySelectorAll('[data-copy]').forEach(el=>el.addEventListener('click',()=>copy(el.dataset.copy)));
  document.getElementById('ldbDetailCopySvg')?.addEventListener('click',()=>copy(item.svg));
  document.getElementById('ldbDetailCopyJson')?.addEventListener('click',()=>copy(ctx.jsonMeta));
  bindLogoXrayStage(item,ctx.anatomy,{stage:'ldbHeroStage',overlay:'ldbHeroOverlay',grid:'ldbGridBtn',anc:'ldbAncBtn',ground:'ldbGroundBtn'});
}

async function renderLogoDetail(logoRoute,immediate){
  closeDsSelectMenu(false);
  const tok=++navToken;
  let item=null;
  if(logoRoute.startsWith('pack/')){
    const parts=logoRoute.slice(5).split('/');
    const packId=decodeURIComponent(parts[0]||'');
    const glyphName=decodeURIComponent(parts.slice(1).join('/')||'');
    const pk=ICON_PACKS[packId];
    const g=(pk&&pk.glyphs||[]).find(x=>x.name===glyphName);
    if(g) item=makePackLogoItem(packId,pk,g);
  }else{
    const logoId=decodeURIComponent(logoRoute);
    item=logoByIdCache.get(logoId)||null;
    if(!item && location.protocol.startsWith('http')){
      startLoader();
      try{
        const res=await fetch('/api/logos?id='+encodeURIComponent(logoId));
        if(res.ok){
          const j=await res.json();
          if(j&&j.ok&&j.logo){ item=j.logo; logoByIdCache.set(item.id,item); }
        }
      }catch(_){}finally{ stopLoader(); }
    }
  }
  if(tok!==navToken) return;
  if(!item){ location.hash='#/logos'; return; }

  const ctx=getLogoContext(item);
  const apply=()=>{
    resetSystemTheme();
    state.view='logos';
    syncTopSearchPlaceholder();
    document.getElementById('catBtn').setAttribute('aria-pressed','false');
    document.getElementById('logosBtn').setAttribute('aria-pressed','true');
    document.getElementById('rankBtn').setAttribute('aria-pressed','false');
    document.getElementById('viewBtn').setAttribute('aria-pressed','false');
    index.style.display='none';
    logosEl.style.display='none';
    rankingEl.style.display='none';
    coverageEl.style.display='none';
    applyLogoHeaderSlabs(item);
    detail.innerHTML=buildLogoDetailHtml(item,ctx);
    detail.classList.add('on');
    bindLogoDetailInteractions(item,ctx);
    if(!immediate) window.scrollTo(0,0);
  };
  if(immediate){ apply(); return; }
  await runViewTransition('chameleon',apply,detail);
}

/* ---------- wiring ---------- */
let initialLoad=true;
function syncTopSearchPlaceholder(){
  const qEl=document.getElementById('q');
  const chipsEl=document.getElementById('chips');
  const isLogos=state.view==='logos';
  if(qEl) qEl.placeholder=isLogos?'Search logos, geometry, or packs\u2026':'Search systems, intent, or repo\u2026';
  if(chipsEl) chipsEl.style.display=isLogos?'none':'';
}

function showView(immediate){
  closeDsSelectMenu(false);
  ++navToken;
  clearTimeout(loaderT);
  const loaderEl=document.getElementById('topLoader');
  if(loaderEl) loaderEl.classList.remove('on');
  const wasSysActive=document.documentElement.classList.contains('sys-active');
  const cov=state.view==='coverage';
  const rk=state.view==='ranking';
  const lg=state.view==='logos';
  const sys=!cov&&!rk&&!lg;
  const apply=()=>{
    resetSystemTheme();
    syncTopSearchPlaceholder();
    index.style.display=sys?'':'none';
    logosEl.style.display=lg?'':'none';
    rankingEl.style.display=rk?'':'none';
    coverageEl.style.display=cov?'':'none';
    detail.classList.remove('on');
    document.getElementById('catBtn').setAttribute('aria-pressed',String(sys));
    document.getElementById('logosBtn').setAttribute('aria-pressed',String(lg));
    document.getElementById('rankBtn').setAttribute('aria-pressed',String(rk));
    document.getElementById('viewBtn').setAttribute('aria-pressed',String(cov));
    if(cov) renderCoverage();
    else if(rk) renderRanking();
    else if(lg){
      buildLogoDbShell();
      syncLogoControls();
      loadLogoStats();
      if(logoState.subTab==='logos') fetchLogos();
      else renderIconPackGrid();
    }
    else renderIndex();
    if(!immediate) window.scrollTo(0,0);
  };
  if(immediate){ apply(); return; }
  const kind=wasSysActive?'chameleon':'tab';
  const fb=lg?logosEl:(cov?coverageEl:(rk?rankingEl:index));
  runViewTransition(kind,apply,fb);
}

function navigateTab(nextView){
  if(nextView==='logos'){
    if(location.hash==='#/logos'){
      if(window.scrollY>40) window.scrollTo({top:0,behavior:'smooth'});
      return;
    }
    state.view='logos';
    location.hash='#/logos';
    return;
  }
  const hasHash=Boolean(location.hash&&location.hash!=='#');
  if(!hasHash && state.view===nextView){
    if(window.scrollY>40) window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  state.view=nextView;
  if(hasHash){ location.hash=''; return; }
  showView(false);
}

document.getElementById('brandHome').addEventListener('click',()=>navigateTab('systems'));
document.getElementById('catBtn').addEventListener('click',()=>navigateTab('systems'));
document.getElementById('logosBtn').addEventListener('click',()=>navigateTab('logos'));
document.getElementById('rankBtn').addEventListener('click',()=>navigateTab('ranking'));
document.getElementById('viewBtn').addEventListener('click',()=>navigateTab('coverage'));
document.getElementById('q').addEventListener('input',e=>{
  state.q=e.target.value; state.page=1; state.rkShown=state.rkStep||24;
  if(state.view==='logos' || location.hash.startsWith('#/logos')){
    logoState.q=e.target.value; logoState.page=1; logoState.iconPage=1;
    if(location.hash!=='#/logos'){ location.hash='#/logos'; return; }
    syncLogoControls();
    scheduleLogosRefresh();
    return;
  }
  if(location.hash&&location.hash!=='#'){ location.hash=''; return; }
  showView(true);
});
window.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement!==document.getElementById('q') && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){
    e.preventDefault();
    document.getElementById('q').focus();
  }else if(e.key==='Escape' && document.activeElement===document.getElementById('q')){
    document.getElementById('q').blur();
  }
});
document.getElementById('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b||!b.dataset.f) return;
  const f=b.dataset.f;
  const hasHash=Boolean(location.hash&&location.hash!=='#');
  if(!hasHash && state.filter===f && state.view==='systems'){
    if(window.scrollY>40) window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  state.filter=f;
  state.page=1;
  document.querySelectorAll('.chip[data-f]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));
  state.view='systems';
  if(hasHash){ location.hash=''; return; }
  showView(false);
});
async function hydrateFromDb(){
  if(!location.protocol.startsWith('http')) return;
  try{
    const res=await fetch('/api/catalog');
    if(!res.ok) return;
    const j=await res.json();
    if(!j||!j.dbBacked||!Array.isArray(j.systems)||!j.systems.length) return;
    DATA=j.systems;
    if(j.iconPacks) ICON_PACKS=j.iconPacks;
    if(j.coverage) COVERAGE=j.coverage;
    DB_META={ live:true, syncedAt:j.syncedAt||null };
    const slug=location.hash.replace(/^#\/?/,'');
    if(!slug && state.view!=='logos') showView(true);
    else if(slug.startsWith('logos/pack/')) renderLogoDetail(slug.slice(6),true);
    else if(state.view==='logos' && slug==='logos'){ renderLogoStats(); if(logoState.subTab==='icons') renderIconPackGrid(); }
  }catch(_){}
}
function route(){
  const immediate=initialLoad;
  initialLoad=false;
  const slug=location.hash.replace(/^#\/?/,'');
  if(slug==='logos'){
    state.view='logos';
    showView(immediate);
    return;
  }
  if(slug.startsWith('logos/')){
    renderLogoDetail(slug.slice(6),immediate);
    return;
  }
  if(slug){ renderDetail(slug,immediate); return; }
  if(state.view==='logos') state.view='systems';
  showView(immediate);
}
window.addEventListener('hashchange',route);
route();
hydrateFromDb();
</script>
